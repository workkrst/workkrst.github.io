<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>YouTube 요약 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:#0f1117;color:#e7e9ee;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 90px}
header{text-align:center;padding:40px 0 8px}
h1{font-size:26px;font-weight:800}
header .sub{color:#8b90a0;font-size:13.5px;margin-top:8px}
.count{display:inline-block;background:#1c2030;color:#c4b5fd;border:1px solid #2c3150;border-radius:20px;padding:4px 16px;font-size:12.5px;font-weight:600;margin-top:14px}
.list{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:16px;align-items:stretch;background:#171a24;border:1px solid #262b3a;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
.row:hover{border-color:#7c3aed55;background:#191d29}
.thumb{position:relative;flex:0 0 168px;aspect-ratio:16/9;background:#0a0c12;align-self:flex-start;margin:12px 0 12px 12px;border-radius:9px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play span{background:#000000aa;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding:14px 16px 14px 0}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#8b90a0}
.badge{font-size:11px;font-weight:600;border-radius:12px;padding:2px 10px;background:#211d33;color:#c4b5fd}
.yt{margin-left:auto;font-size:11.5px;font-weight:700;text-decoration:none;color:#fff;background:#ff000022;border:1px solid #ff000044;border-radius:9px;padding:4px 11px;transition:background .15s;white-space:nowrap}
.yt:hover{background:#ff000044}
.title{font-size:15.5px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{font-size:12.5px;color:#a9aec0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:12.5px;font-weight:700;color:#c4b5fd;margin-top:auto}
@media(max-width:560px){
  .row{flex-direction:column;gap:0}
  .thumb{margin:12px 12px 0;width:calc(100% - 24px);flex:none}
  .body{padding:12px 16px 14px}
  .more{display:none}
}
.empty{margin-top:44px;text-align:center;color:#6b7180;font-size:14px;background:#171a24;border:1px dashed #2c3142;border-radius:16px;padding:52px 20px}
footer{text-align:center;color:#565b6b;font-size:11.5px;margin-top:52px}
</style>
</head><body>
<div class="wrap">
  <header>
    <h1>📺 YouTube 요약 아카이브</h1>
    <div class="sub">행을 클릭해서 분석 요약을 보고, 원본 영상은 버튼으로 이동합니다</div>
    <div class="count" id="count">분석 영상 0편</div>
  </header>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" style="display:none">아직 분석된 영상이 없습니다.<br>분석이 완료되면 이곳에 목록이 자동으로 쌓입니다.</div>
  <footer>noindex · 비공개 아카이브 — 무단 공유 금지</footer>
</div>
<script>
fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  const v=(d.videos||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  document.getElementById('count').textContent='분석 영상 '+v.length+'편 · 업데이트 '+(d.updated||'-');
  if(!v.length){document.getElementById('empty').style.display='block';return;}
  const list=document.getElementById('list');
  list.innerHTML=v.map(x=>{
    const thumb=x.videoId?('https://i.ytimg.com/vi/'+x.videoId+'/hqdefault.jpg'):'';
    const ytBtn=x.videoId?'<a class="yt" href="https://www.youtube.com/watch?v='+x.videoId+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ 원본</a>':'';
    return '<a class="row" href="./'+x.slug+'/">'
      +'<div class="thumb">'+(thumb?'<img src="'+thumb+'" alt="" loading="lazy">':'')+'<div class="play"><span>▶</span></div></div>'
      +'<div class="body">'
      +'<div class="meta"><span class="badge">'+x.date+'</span>'
      +(x.channel?'<span>'+x.channel+'</span>':'')
      +(x.duration?'<span>· '+x.duration+'</span>':'')+ytBtn+'</div>'
      +'<div class="title">'+x.title+'</div>'
      +'<div class="desc">'+(x.summary||'')+'</div>'
      +'<div class="more">요약 보기 →</div>'
      +'</div></a>';
  }).join('');
}).catch(()=>{document.getElementById('empty').style.display='block';});
</script>
</body></html>
