     "text": "[@pc4media](https://www.producthunt.com/@pc4media) Many congratulations Ziga, Peter, Davorin and team on another great launch! 😊\n\n**How I met the makers?**\n\nI met the makers through a hunter friend in March. This is our seventh launch together in the past seven months.\n\n**What is the new launch about?**\n\nDatabox is an agentic analytics platform that brings together your business performance data and gives your AI Analyst, Genie, the context behind every metric.\n\nWith MCP Connectors, it can pull information from tools like HubSpot, Slack, Notion, Linear, Mixpanel, Semrush, and Klaviyo, so when a number changes, you do not just see _what_ happened, but also _why_ it happened. You can even automate actions based on the insights through Skills and Routines.\n\n**Why I endorse it?**\n\nI endorse this launch because it solves a very real problem: dashboards often tell you that a metric moved, but the actual explanation lives in your CRM, support desk, project tools, or team conversations.\n\n[@Databox](https://www.producthunt.com/products/databox) connects those dots automatically, saves teams from manual reporting, and makes AI-generated insights more grounded, actionable, and useful.\n\nThe team’s consistent shipping cadence and focus on practical AI workflows make this a standout launch. ❤️",
     "kr": "[@pc4media](https://www.producthunt.com/@pc4media) Ziga, Peter, Davorin 그리고 팀 여러분, 또 한 번의 멋진 출시를 진심으로 축하드립니다! 😊\n\n**메이커들을 어떻게 알게 되었나요?**\n\n지난 3월 헌터 친구를 통해 메이커들을 처음 만났습니다. 지난 7개월 동안 벌써 일곱 번째로 함께하는 출시네요.\n\n**이번 신규 출시는 어떤 제품인가요?**\n\nDatabox는 비즈니스 성과 데이터를 통합하고 AI 애널리스트인 Genie에게 각 지표의 숨은 배경 맥락을 제공하는 에이전틱 분석 플랫폼입니다.\n\nMCP 커넥터를 통해 HubSpot, Slack, Notion, Linear, Mixpanel, Semrush, Klaviyo 등의 도구에서 정보를 가져오므로 수치가 변했을 때 단순히 '무엇이' 일어났는지뿐만 아니라 '왜' 일어났는지까지 확인할 수 있습니다. 스킬과 루틴을 통해 인사이트를 바탕으로 한 후속 조치까지 자동화할 수 있죠.\n\n**이 제품을 지지하는 이유:**\n\n대시보드는 지표가 변했다는 사실만 알려줄 뿐 실제 원인 설명은 CRM, 헬프데스크, 프로젝트 관리 도구, 팀 대화 속에 묻혀 있는 현실적인 문제를 해결해 주기 때문입니다.\n\n[@Databox](https://www.producthunt.com/products/databox)는 이러한 파편화된 접점들을 자동으로 연결하여 수동 보고 작업에서 팀을 해방하고, AI가 생성한 인사이트를 훨씬 탄탄하고 실행 가능하며 유용하게 만들어 줍니다.\n\n꾸준한 제품 릴리즈 속도와 실용적인 AI 워크플로우에 대한 집중도가 이번 출시를 더욱 돋보이게 만듭니다. ❤️"

     "author": "Ziga Potocnik",
     "is_maker": true,
     "text": "[@curiouskitty](https://www.producthunt.com/@curiouskitty) Great question. Here's how we approached it.\n\n  \n**What shipped first.** We started from two signals. The first was which tools our customers already connect to Databox as data sources, since that's where the metrics come from. The second was where the \"why\" behind those metrics usually lives: team chat, docs, project tools, email, and calendars. A connector made the first list only if it could explain a real metric change. For example, it should show the actual ad creative behind a CPC shift or the deal notes behind a revenue drop, not just repeat numbers we already have.\n\n  \n**Our bar for good enough:**\n\n*   **Vendor-built and vendor-hosted.** Every official connector uses the vendor's own remote MCP server. We don't maintain community forks.\n    \n*   **Standard, reliable auth.** Almost all use OAuth, so connecting takes one click and a sign-in. Servers that need self-hosting or a custom deployment stay out of the official list.\n    \n*   **Tools that add context.** We rated each server on whether its tools actually help explain a number. Some servers only return the same numbers we already ingest, with no access to the content behind them. We ranked those lower even when the tool is popular.\n    \n*   **Granular tools.** Every tool is listed separately, and permissions work tool by tool with one main setting per connector. That only works if the server's tools are split sensibly.\n    \n\n**Everything else goes through custom connectors.** The MCP ecosystem is moving too fast for any official list to keep up. Custom connectors take any server URL with OAuth, API key, or bearer token auth. They go through the same schema parsing and the same per-tool permissions, so the long tail works on day one. Tools that people keep adding as custom connectors are strong candidates for the official list.",
     "kr": "[@curiouskitty](https://www.producthunt.com/@curiouskitty) 좋은 질문입니다. 저희 접근 방식은 다음과 같습니다.\n\n**우선 출시 기준:** 저희는 두 가지 신호에서 출발했습니다. 첫 번째는 지표의 원천이 되는 데이터 소스로서 고객들이 이미 Databox에 가장 많이 연결해 둔 도구가 무엇인가였고, 두 번째는 지표 이면의 '이유'가 주로 존재하는 곳(팀 메신저, 문서, 프로젝트 도구, 이메일, 캘린더)이었습니다. 이미 보유한 숫자를 단순히 반복하는 것이 아니라 CPC 변화 이면의 실제 광고 소재나 매출 감소 이면의 딜 메모를 보여줄 수 있는 등 실제 지표 변화를 설명할 수 있는 커넥터만을 1차 목록에 포함했습니다.\n\n**기본 커넥터 품질 기준:**\n* **벤더 자체 구축 및 호스팅:** 모든 공식 커넥터는 벤더 자체 원격 MCP 서버를 사용합니다. 커뮤니티 포크 버전은 유지 관리하지 않습니다.\n* **표준적이고 안정적인 인증:** 대부분 OAuth를 사용하여 클릭 한 번과 로그인만으로 연결됩니다. 자체 호스팅이나 별도 배포가 필요한 서버는 공식 목록에서 제외했습니다.\n* **맥락을 더해주는 도구:** 서버의 도구가 실제로 수치를 설명하는 데 도움이 되는지 평가했습니다. 인기 있는 도구라도 배경 콘텐츠 없이 단순 수치만 반환하는 서버는 후순위로 미뤘습니다.\n* **세분화된 도구:** 각 도구가 분리되어 개별 도구 단위로 권한이 제어될 수 있어야 합니다.\n\n**그 외의 모든 도구는 커스텀 커넥터로 지원:** 공식 목록만으로는 급변하는 MCP 생태계를 모두 따라잡을 수 없습니다. 커스텀 커넥터는 URL과 OAuth, API 키, 토큰 인증만으로 어떤 서버든 연결 가능하며 동일한 스키마 파싱 및 도구별 권한 제어가 적용되므로 롱테일 도구도 출시 첫날부터 바로 활용할 수 있습니다. 사용자들이 커스텀으로 자주 추가하는 도구는 차기 공식 커넥터의 강력한 후보가 됩니다."

     "author": "Ziga Potocnik",
     "is_maker": true,
     "text": "[@alp_adur](https://www.producthunt.com/@alp_adur) Thanks, Latif, and great question. You're right that the retrieval side does most of the work here.  \n\nThe numbers aren't generated. When Genie, our AI Analyst, answers a metric question, it queries your actual Databox data sources connected or uses correct MCP tool calls and works from what comes back. It doesn't recall or estimate numbers. Connectors work the same way. The context behind a number comes from live tool calls to your connected tools, so the AI Analyst is pointing at a real deal, ticket, or thread. It isn't writing its own version of what probably happened.  \n\nIt also points you to the source it used, so you can open it and check. We don't claim hallucinations are impossible. No one building on LLMs honestly can. But grounding every answer in retrieved data and showing where it came from is how we keep it tight, and how you can catch it when something's off.",
     "kr": "[@alp_adur](https://www.producthunt.com/@alp_adur) Latif님 감사합니다. 아주 훌륭한 질문입니다. 말씀하신 대로 검색(retrieval) 영역이 대부분의 역할을 담당하고 있습니다.\n\n숫자는 모델이 임의로 생성해 내는 것이 아닙니다. AI 애널리스트 Genie가 지표 질문에 답할 때 실제로 연동된 Databox 데이터 소스를 쿼리하거나 정확한 MCP 도구 호출을 수행하여 반환된 실제 결과값을 기반으로 작동합니다. 숫자를 기억에 의존하거나 추정하지 않습니다. 커넥터 역시 마찬가지 방식으로 작동합니다. 수치 이면의 맥락은 연결된 도구로의 실시간 도구 호출에서 나오므로, AI 애널리스트는 가공된 이야기가 아닌 실제 딜, 티켓, 대화 스레드를 정확히 가리킵니다.\n\n또한 사용한 원천 출처를 직접 링크해 주므로 사용자가 언제든 열어 확인할 수 있습니다. LLM을 기반으로 제품을 만드는 사람이라면 누구도 환각이 100% 불가능하다고 솔직히 단언할 수는 없을 것입니다. 하지만 검색된 실데이터에 모든 답변의 근거를 두고 그 출처를 명확히 제시하는 방식으로 오차를 최소화하고, 이상이 있을 때 사용자가 즉시 발견할 수 있도록 설계했습니다."

    {
     "author": "Jakob Zmrzlikar",
     "is_maker": true,
     "text": "Hey PH, I am Jakob, one of the engineers who worked on MCP connectors.  \n  \nThe idea is simple: Genie already knows your number, and now it can check the tools where the whole story behind them lives, eg. your CRM, Slack, or ad account. It can also act there on your behalf, like updating a deal or posting a message.\n\nSince that means AI touching real tools, we put a lot of care into permissions. Every single action can be set to always allow, needs approval, or blocked. Anything that can change something asks you first by default, and Genie waits for your OK before running it.  \n  \nAnd if any tool you use isn't in our predefined catalog, you can still connect it yourself. Many apps now offer MCP connection link, so you just paste that in and Genie picks up that functionality. Because that link could point anywhere, we check it carefully before connecting.  \n  \nHappy to answer any technical questions :) Which tool is the first you would trust Genie to use?",

     "text": "Hey Product Hunt. Yevhen here.\n\nI have built and grown websites for over 20 years, living inside analytics every day. GA4 kept growing, with more reports and more setup, most of which I never opened. :) At some point I found myself taking a Google Analytics course, and that is when it clicked: I am not the audience for this product. So I started building my own.\n\nBuilding it myself meant I set the requirements, and from the start those were: collect as little as possible, no fingerprinting, and a product shaped around European regulation. Statable is **cookieless, EU-hosted (NL)** and needs no consent banner for analytics.\n\nThen AI got good enough to take over my routine work, but agents had no way into analytics. That is what the **MCP server** fixed. Now the numbers live where I already work: I ask Claude what moved last week and get an answer from my own data, and when I need a funnel for the signup flow I describe it in a sentence instead of clicking through a builder.\n\nConnecting is one OAuth sign-in, and you choose whether an assistant can configure anything or only read.\n\n**Free forever on .edu and GitHub or GitLab Pages.**\n\nWould you use this? If not, what stops you? I am here all day.",

   "desc_kr": "VibeDefend by CybeDefend는 단 한 줄의 npx 명령어로 Claude Code, Cursor, Windsurf, Copilot, Codex 등 주요 AI 코딩 에이전트에 직접 설치되는 실시간 보안 가드 솔루션입니다. 코드가 커밋된 사후에 검사하는 기존 보안 스캐너와 달리, 에이전트가 코드를 작성하는 바로 그 순간(Shift-0)에 열려 있는 diff를 실시간 검사합니다. 리포지토리 분석을 통해 사내 고유의 비즈니스 규칙과 규정 준수 사항을 자동 마이닝하여 에이전트의 컨텍스트에 주입함으로써 보안 부채를 사전에 차단합니다. 또한 rm -rf, sudo 실행, .env나 시크릿 키 무단 읽기 등 위험한 셸 명령과 치명적 실수를 감지하여 실행 전에 강력히 차단하는 액션 가드(Action Guard) 기능을 제공합니다. SAST, SCA, 시크릿 유출 방지, IaC 및 컨테이너 스캔을 망라하여 개발자가 '바이브 코딩(Vibe Coding)'의 속도를 유지하면서도 기업 보안 기준을 완벽히 지킬 수 있도록 돕습니다.",

    {
     "author": "Axel Paulin",
     "is_maker": true,
     "text": "Hey Product Hunt ! 👋 I’m Axel, the third co-founder, handling Growth and Go-To-Market here at CybeDefend\n\n  \n[@julien_zammit](https://www.producthunt.com/@julien_zammit) shared our origin story, and [@florentin_ledy](https://www.producthunt.com/@florentin_ledy) highlighted the tech. I want to talk about what happens when you actually put VibeDefend in the hands of a dev team.  \n\nWhen we ran our study, we found something crazy: left to their own devices, AI agents ignored internal business and compliance rules in 88% of cases. They write fast, but they accumulate silent technical debt just as quickly.  \n\n**By governing the agent at the exact moment the code is written (an approach we call \"Shift-0\"), VibeDefend brings that rule compliance up to 89%.**  \n\nIt’s not just a security tool; **it’s an enabler.** It allows your team to confidently scale \"vibe-coding\" without the CISO or the Lead Dev losing sleep over what’s being shipped to production.\n\n  \nI’ll be hanging out in the comments all day with the team. I'd love to know: what is the main risk keeping your team from giving full autonomy to AI coding agents right now? Let's chat!",

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="lnk" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="lnk" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">💬 PH에서 보기</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
renderToolbar();renderGrid();
</script>
