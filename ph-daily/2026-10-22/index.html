     "author": "Arick Goomanovsky",
     "is_maker": true,
     "text": "Hi Product Hunt,\n\nI'm Arick, co-founder and CEO of BAND. Today we're launching BAND for Developers.\n\nIf you run more than one coding agent, you know the pattern. Each agent is fast on its own, but they can't talk to each other, so you become the go-between. You copy context from one session into the next, tell the test agent what the refactor agent just changed, and find out an hour later that two agents made opposite assumptions about the same interface. More agents should mean more work done. Instead, a lot of it turns into more coordination for you.\n\nMost multi-agent dev tools today give you a better dispatch board. You assign tasks, agents run in parallel, you review what comes back. That helps with throughput, but every handoff still goes through a human.\n\nBAND for Developers lets the agents work it out between themselves:\n\n\\- Connect the agents you already run. Claude Code, Codex, GitHub Copilot and OpenCode agents join shared rooms across machines. You keep your IDE, your terminal and your workflow.\n\n\\- Agents collaborate directly. They message each other, delegate, review each other's work and unblock one another. They can pull in a teammate's agent when the work needs it. Plans, decisions and work state live in the room rather than inside one session, so they survive when a session ends.\n\n\\- You step in when it matters. You keep working from the terminal. BAND desktop shows what's moving, what's blocked and which agent is waiting on you. Open the room, answer the question or redirect the agent, then step back out while the rest of the work keeps going.\n\nThe difference is that the agents aren't only running side by side. They coordinate while the work is happening, so many of the handoffs you'd normally do yourself happen without you. And you don't have to move your whole team onto one vendor's agents to get there.\n\nBAND desktop is free. Download it at band.ai/use-cases/band-desktop. We'd like to hear where it breaks for you, especially if your agents run across more than one harness. The team and I will be in the comments all day.",
     "kr": "안녕하세요 프로덕트 헌트 여러분,\n\n저는 BAND의 공동 창업자이자 CEO인 Arick입니다. 오늘 저희는 BAND for Developers를 출시합니다.\n\n둘 이상의 코딩 에이전트를 사용해 보셨다면 익숙한 패턴이 있을 것입니다. 각 에이전트는 단독으로는 빠르지만 서로 소통할 수 없기 때문에 개발자가 중간 매개자가 되어야 합니다. 한 세션에서 다음 세션으로 컨텍스트를 복사해 넣고, 리팩토링 에이전트가 방금 변경한 내용을 테스트 에이전트에 알려주다 보면, 한 시간 뒤 두 에이전트가 동일한 인터페이스에 대해 정반대의 가정을 했다는 사실을 발견하게 되죠. 더 많은 에이전트를 쓰면 더 많은 작업을 마칠 수 있어야 하는데, 현실은 개발자의 조율 부담만 가중됩니다.\n\n오늘날 대부분의 멀티 에이전트 개발 도구는 일종의 발전된 작업 배분판에 가깝습니다. 사람이 작업을 할당하고 에이전트가 병렬 실행된 뒤 돌아온 결과를 검토하지만, 모든 인수인계는 여전히 사람의 손을 거쳐야 합니다.\n\nBAND for Developers는 에이전트들이 스스로 조율하며 작업할 수 있게 합니다:\n\n- 이미 실행 중인 에이전트 연결: Claude Code, Codex, GitHub Copilot, OpenCode 에이전트가 여러 머신에 걸친 공유 룸에 참여합니다. 기존의 IDE, 터미널, 워크플로우를 그대로 유지할 수 있습니다.\n\n- 에이전트 간 직접 협업: 에이전트끼리 메시지를 주고받고, 작업을 위임하며, 서로의 작업을 검토하고 막힌 곳을 풀어줍니다. 작업에 필요하다면 동료 팀원의 에이전트를 불러올 수도 있습니다. 계획, 결정 및 작업 상태가 단일 세션 내부가 아니라 공유 룸에 저장되므로 세션이 종료되어도 유지됩니다.\n\n- 중요한 순간에만 개입: 개발자는 평소처럼 터미널에서 계속 작업하면 됩니다. BAND 데스크톱은 어떤 작업이 진행 중이고, 어디가 막혔으며, 어떤 에이전트가 사용자의 결정을 기다리고 있는지 보여줍니다. 해당 룸을 열어 질문에 답하거나 에이전트의 방향을 수정한 뒤 다시 빠져나오면 나머지 작업은 계속 진행됩니다.\n\n단순히 에이전트들이 나란히 실행되는 것과의 차이점은, 작업이 진행되는 동안 에이전트들이 서로 조율하기 때문에 평소 직접 처리해야 했던 수많은 인수인계가 사용자 없이도 알아서 일어난다는 점입니다. 이를 위해 팀 전체를 특정 벤더의 에이전트로 통일할 필요도 없습니다.\n\nBAND 데스크톱은 무료입니다. band.ai/use-cases/band-desktop 에서 다운로드하실 수 있습니다. 특히 에이전트가 둘 이상의 하네스에서 실행되는 환경에서 개선할 점이 있다면 언제든 알려주세요. 팀원들과 함께 온종일 댓글에 대기하겠습니다."

     "is_maker": true,
     "text": "[@gavin\\_fgg0815](https://www.producthunt.com/@gavin_fgg0815) Hey Gavin, thanks! Yes, getting the answer right is the most important challenge.  \n  \nGenie and Cortex are the agent layers from SF and DB. These are their agent building tools and somewhat similar. What sets Querri apart is that it's the full stack, from ingestion to data lake to semantic layer to chat and dashboards, all in one package with one bill that can be set up in a few minutes and managed by the whole team. We're really aiming to support the teams that don't have the time, budget and team to do multi-quarter data projects.  \n  \nAs to accuracy, we take that super seriously. All the answers are structured, so you can trace the number in plain english (and SQL as needed) all the way back to the source data. We can only do this because we've got the raw data all the way through the computations, and because the core of the agent is built around repeatable analyses not just spitting out an answer which can and will sometimes be hallucinated.\n\n![](https://ph-files.imgix.net/794c7dde-137c-4f00-9fc4-c19cb8bb9545.png?auto=compress,format&codec=mozjpeg&cs=strip)",
     "kr": "@gavin_fgg0815 Gavin 님 안녕하세요, 감사합니다! 맞습니다, 올바른 답변을 얻는 것이 가장 중요한 과제입니다.\n\nGenie와 Cortex는 SF와 DB의 에이전트 레이어입니다. 이들은 에이전트 구축 도구이며 어느 정도 유사한 면이 있습니다. Querri의 차별점은 수집부터 데이터 레이크, 시맨틱 레이어, 채팅 및 대시보드에 이르기까지 전체 스택을 단일 패키지와 하나의 청구서로 제공한다는 점입니다. 몇 분 만에 설정하여 팀 전체가 관리할 수 있죠. 저희는 수 분기가 걸리는 대규모 데이터 프로젝트를 진행할 시간, 예산, 인력이 부족한 팀들을 진정으로 지원하고자 합니다.\n\n정확도에 관해서는 저희도 매우 진지하게 접근하고 있습니다. 모든 답변은 구조화되어 있어 자연어(필요시 SQL 포함)로 원천 데이터까지 수치를 완전히 역추적할 수 있습니다. 계산 전 과정에 걸쳐 원시 데이터를 보유하고 있으며, 에이전트의 코어가 단순히 때로는 환각을 일으킬 수 있는 답변을 내뱉는 것이 아니라 반복 가능한 분석을 중심으로 구축되어 있기 때문에 이것이 가능합니다.\n\n![](https://ph-files.imgix.net/794c7dde-137c-4f00-9fc4-c19cb8bb9545.png?auto=compress,format&codec=mozjpeg&cs=strip)"

     "author": "Dave Ingram",
     "is_maker": true,
     "text": "[@gavin\\_fgg0815](https://www.producthunt.com/@gavin_fgg0815) I think this is the big challenge of the AI era ... fast answers that look right but don't get verified. The good news is, with Querri there's literally nothing you can't deeply inspect both in plain English and in the code. So there's nothing you could check in a dashboard or an Excel formula that you couldn't walk back through here, and we lay it out a lot cleaner imho.  \n  \nThe other thing we can do with AI and do extensively in Querri is double / triple check the numbers and very deliberately surface caveats and alternate readings right in the chat. In our evals, we're 6x more likely to show you an alternate reading that Claude Code does without going and explicitly asking it for alternate readings (which pretty close to nobody does ... and they rarely do with dashboards or other tools either).  \n  \nThat said, pre orchestration is definitely great when it can be done, which is what we do in the Library. You can define exact SQL for a KPI, and build precomputed Views for common questions, but unlike some systems that only allow you to then read from those, Querri can fall back to the raw data (if you've given access to it...all configurable) and still get the autonomous agent capability.",
     "kr": "@gavin_fgg0815 그것이 바로 AI 시대의 거대한 과제라고 생각합니다... 그럴듯해 보이지만 검증되지 않은 빠른 답변들 말이죠. 다행히 Querri에서는 자연어와 코드 양쪽 모두에서 깊이 들여다볼 수 없는 부분이 전혀 없습니다. 따라서 대시보드나 엑셀 수식에서 확인할 수 있는 모든 것을 여기서 거슬러 올라가며 점검할 수 있으며, 제 생각에는 훨씬 깔끔하게 정리되어 있습니다.\n\n또한 저희가 AI를 통해 광범위하게 수행하는 또 다른 작업은 수치를 이중, 삼중으로 교차 검증하고 대화창에서 주의사항과 대안적 해석을 적극적으로 표출하는 것입니다. 자체 평가에 따르면, 대안적 해석을 명시적으로 요구하지 않더라도 Querri가 이를 제시할 확률은 Claude Code보다 6배 높습니다(실제로 대안을 묻는 사람은 거의 없으며 대시보드에서도 마찬가지입니다).\n\n물론 가능할 때는 사전 조율이 훌륭한 방법이며, 그것이 바로 The Library에서 저희가 하는 일입니다. KPI에 대한 정확한 SQL을 정의하고 자주 묻는 질문에 대해 미리 계산된 뷰(View)를 구축할 수 있습니다. 하지만 오직 뷰만 읽을 수 있는 일부 시스템과 달리, Querri는 (권한이 허용된 경우) 원시 데이터로 폴백하여 에이전트의 자율적 기능도 계속 발휘할 수 있습니다."

     "author": "Dave Ingram",
     "is_maker": true,
     "text": "Hi Product Hunt! Dave here, founder and CEO of Querri.  \n\nToday we’re launching the Querri Library and the Librarian, the biggest release in Querri’s history. Querri is the question-first data platform: you start with the questions your business asks, and Querri builds what’s needed to answer them, then keeps learning your business.  \n\n**The problem → solution**\n\nAI made asking your data a question easy. It didn’t make the answer yours. Point a general-purpose AI at real company data, with hundreds of tables and five definitions of “active customer,” and it picks one. Ask again tomorrow and it may pick another.\n\nSo we stopped trying to make the AI a better guesser and changed what it’s standing on. The **Library** is a map of your business: the questions your team keeps asking, the KPIs that answer them, the definitions behind those numbers, and the data they’re computed from. The **Librarian** is the agent that builds it with you, in plain English, and answers from it.  \n\n**What makes it different?**\n\nA chatbot on top of your data is easy to build. I can say that with some authority, because that’s roughly where Querri started. What’s hard is making the answers right, and yours. Every answer in Querri shows the rows, the calculation and the sources it read. Every piece of data loaded gets 180+ quality checks. When a question has more than one reasonable reading, Querri tells you. In our benchmarking, Querri flagged the other defensible answer on 73% of its responses, versus 12% for a leading general-purpose AI agent given the same data. And when the data is too messy or isn’t there, it tells you what’s missing instead of handing you a confident number that happens to be wrong.\n\n  \nAnd all of this feeds into chat, dashboards, MCP for Claude, ChatGPT and the like, and APIs and CLI for further extension.  \n\n**Key features & use cases:**\n\n*   Start from your questions before you connect a single file\n    \n*   125+ connectors, plus spreadsheets and files\n    \n*   KPIs defined once and tied to Revenue, Cost, Efficiency, Quality or Risk\n    \n*   Business rules you settle in chat (“sales means paid orders only”) saved as facts\n    \n*   Paste a screenshot or sketch of an old dashboard and it rebuilds it, calculations included\n    \n*   Monitors that watch a KPI by region, store or rep and tell you which one moved (set up with an agent but run without every time the data updates)\n    \n*   Share a cleaned view with another team instead of the raw tables via access controlled workspaces .. we’re talking real life data work here after all.\n    \n*   While you sleep, Querri “dreams” about your business and suggests new questions and KPIs. Nothing changes without your OK.\n    \n\n**Who is it for?**\n\nOps, customer success and revenue teams whose answers live across several systems. Small business owners doing the data work themselves. Consultants who want each client’s definitions to live somewhere. Data teams who want give the business an easy, accurate and reliable front door and free their issue queue. And software companies that want to white-label it for their own customers.\n\nIt learns your business, and it never trains a model on your data. We’re SOC 2 Type II, HIPAA and ISO 27001:2022 certified.\n\nMy ask: bring the question that tripped up the last AI you tried, and tell us what Querri does with it. I’ll be here all day reading and answering every comment.  \n\nThe full story is on our blog: [https://querri.com/blog/introducing-the-querri-library-and-librarian/](https://querri.com/blog/introducing-the-querri-library-and-librarian/)\n\nDave  \n  \nP.S., want to really put it through the paces? Sign up for a trial with HUNTER1000 promo code and you'll get a 1000 bonus credits to get some serious value out of your data.",
     "kr": "프로덕트 헌트 여러분 안녕하세요! Querri의 창업자이자 CEO Dave입니다.\n\n오늘 저희는 Querri 역사상 가장 큰 릴리즈인 The Querri Library와 Librarian을 선보입니다. Querri는 질문 중심의 데이터 플랫폼입니다. 비즈니스가 묻는 질문에서 시작하여 그에 답하는 데 필요한 것을 구축하고 회사의 비즈니스를 지속적으로 학습합니다.\n\n문제와 해결책:\nAI 덕분에 데이터에 질문을 던지기는 쉬워졌지만, 그 답변이 '우리 회사만의 것'이 되지는 못했습니다. 수백 개의 테이블과 '활성 고객'에 대한 5가지 정의가 혼재된 실제 기업 데이터에 범용 AI를 적용하면 아무거나 하나를 임의로 고릅니다. 내일 다시 물어보면 또 다른 정의를 선택할 수도 있죠.\n\n그래서 저희는 AI가 더 잘 찍어 맞추게 만드는 시도를 멈추고, AI가 딛고 서 있는 기반 자체를 바꾸었습니다. 'Library'는 여러분 회사의 지도입니다. 팀이 계속 묻는 질문, 이에 답하는 KPI, 그 수치 이면의 정의, 그리고 계산의 바탕이 되는 데이터가 담겨 있습니다. 'Librarian'은 자연어로 사용자와 함께 이를 구축하고 그 위에서 답변을 제공하는 에이전트입니다.\n\n무엇이 다른가요?\n데이터 위에 챗봇을 얹는 것은 누구나 쉽게 만들 수 있습니다. Querri의 출발점도 대략 거기였기에 제가 자신 있게 말씀드릴 수 있습니다. 어려운 것은 답변을 정확하게, 그리고 우리 회사의 현실에 맞게 만드는 일입니다. Querri의 모든 답변은 읽어 들인 행, 계산 과정, 출처를 투명하게 보여줍니다. 로드되는 모든 데이터는 180가지 이상의 품질 검사를 거칩니다. 질문에 합리적인 해석이 둘 이상 존재할 경우 Querri는 이를 알려줍니다. 자체 벤치마크에서 동일한 데이터가 주어졌을 때 선도적 범용 AI 에이전트가 다른 타당한 답변을 지적한 비율은 12%에 불과했던 반면, Querri는 응답의 73%에서 이를 짚어냈습니다. 그리고 데이터가 너무 엉망이거나 누락되었을 때는 잘못된 수치를 자신 있게 제시하는 대신 무엇이 빠졌는지 명확히 말해줍니다.\n\n그리고 이 모든 것은 채팅, 대시보드, Claude 및 ChatGPT 연동을 위한 MCP, API 및 CLI로 확장됩니다.\n\n주요 기능 및 사용 사례:\n* 단 하나의 파일을 연결하기도 전에 질문부터 시작 가능\n* 스프레드시트와 파일을 포함한 125개 이상의 커넥터\n* 매출, 비용, 효율성, 품질, 리스크에 한 번 정의되어 연결되는 KPI\n* 채팅에서 합의된 비즈니스 규칙('매출은 결제 완료된 주문만 의미함')을 팩트로 저장\n* 기존 대시보드의 스크린샷이나 스케치를 붙여넣으면 계산식을 포함하여 재구축\n* 지역, 매장, 담당자별로 KPI를 감시하고 변동을 알려주는 모니터(에이전트로 설정하지만 데이터 업데이트 시마다 자율 실행)\n* 권한 제어 워크스페이스를 통해 원시 테이블 대신 정제된 뷰를 타 팀과 공유\n* 사용자가 자는 동안 Querri가 비즈니스에 대해 '꿈'을 꾸며 새로운 질문과 KPI를 제안(사용자 승인 없이 임의 변경 없음)\n\n누구를 위한 제품인가요?\n답변이 여러 시스템에 흩어져 있는 운영, 고객 성공, 매출 팀. 데이터 작업을 직접 처리하는 소규모 비즈니스 소유자. 각 클라이언트의 정의를 체계화하려는 컨설턴트. 현업에 쉽고 정확하며 신뢰할 수 있는 창구를 제공하여 이슈 큐를 비우고 싶은 데이터 팀. 그리고 고객을 위해 화이트라벨링을 원하는 소프트웨어 회사들입니다.\n\n비즈니스를 학습하되 고객 데이터를 AI 모델 훈련에 절대 사용하지 않습니다. SOC 2 Type II, HIPAA, ISO 27001:2022 인증을 완료했습니다.\n\n부탁드리고 싶은 점: 이전에 사용해 보신 AI를 당황하게 만들었던 질문을 가져와서 Querri가 어떻게 처리하는지 확인해 보세요. 온종일 머물며 모든 댓글을 읽고 답변드리겠습니다.\n\n전체 이야기는 블로그에서 확인하실 수 있습니다: https://querri.com/blog/introducing-the-querri-library-and-librarian/\n\nDave 드림\n\nP.S. 본격적으로 테스트해보고 싶으신가요? 프로모션 코드 HUNTER1000으로 체험판에 가입하시면 데이터에서 진정한 가치를 창출하실 수 있도록 1,000 보너스 크레딧을 드립니다."

    {
     "author": "Amy Ingram",
     "is_maker": true,
     "text": "Building Querri has been quite a journey!  \n\nOur mission, from the very beginning, has been to make working with data accessible to everyone. In a world where businesses collect more data than ever, understanding that data is no longer just a nice-to-have. It can make or break important business decisions.  \n\nBut getting data together from dozens of different systems is hard enough. Getting AI to give you reliable answers based on _your_ **business's definitions** of revenue, churn, or other important metrics is another challenge entirely.  \n\n**We've spent thousands of hours tackling this problem. Because it matters.  \n**\n\nAI is an incredibly powerful tool, but it needs to understand your business context. We're also huge believers in keeping **humans in the loop**. Data has so much nuance, and it would be naive to assume AI automatically knows how your business defines everything or how you want to handle every inconsistency.  \n\nThat's why we've built so many ways for people to guide the AI, teach it their business context, and stay in control of how their data is cleaned, analyzed, and understood.  \n\nAnd security isn't an afterthought. Querri has completed a SOC 2 Type II audit, is ISO 27001:2022 certified, supports HIPAA compliance, and never uses customer data to train AI models.  \n\nI'm incredibly proud of our team and what we've built together.\n\nWe're excited to share it with the Product Hunt community, and we'd genuinely love your feedback, questions, and ideas. That's how we learn, grow, and keep getting better!",

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="lnk" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="lnk" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">💬 PH에서 보기</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
(function(){
 const dq=DATA.disquiet;
 if(!dq||!dq.length)return;
 const sec=$('#dqsec');
 const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const hr=document.createElement('hr');
 hr.className='dq-divider';
 sec.appendChild(hr);
 const head=document.createElement('div');
 head.className='dq-header';
 head.innerHTML=`<h2>🇰🇷 디스콰이엇 신규 프로덕트 ${dq.length}건</h2><div class="dq-sub">disquiet.io 신규 등록 · 한줄 코멘트는 AI 요약</div>`;
 sec.appendChild(head);
 const g=document.createElement('div');
 g.className='grid';
 dq.forEach(p=>{
  const c=document.createElement('div');
  c.className='card dq-card';
  const cmtHtml=p.comment?`<div class="dq-cmt">💡 ${esc(p.comment)}</div>`:'';
  c.innerHTML=`<div class="dq-head"><div class="dq-name">${esc(p.name)}</div><div class="up">▲ ${p.upvotes!=null?p.upvotes:0}</div></div>`+
   `<div class="dq-tag">${esc(p.tagline)}</div>`+
   cmtHtml+
   `<div class="dq-foot"><a class="lnk dq-lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">💬 디스콰이엇에서 보기</a></div>`;
  c.onclick=()=>{if(p.url)window.open(p.url,'_blank','noopener,noreferrer')};
  g.appendChild(c);
 });
 sec.appendChild(g);
})();
renderToolbar();renderGrid();
</script>
</body>
</html>
