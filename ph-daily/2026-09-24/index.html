     "kr": "Product Hunt 여러분 안녕하세요! 👋 Naise AI의 공동창업자 Roy입니다.\n\n**문제와 해결책**\n\n소셜 미디어 마케팅이 제대로 작동하지 않는데 왜 그런지 모르겠다고 느끼신 적 있으신가요? 😵‍💫\n\n여러분은 다음과 같은 점을 잘 알고 계실 것입니다.\n* 우리 비즈니스의 차별점이 무엇인지\n* 콘텐츠와 소셜 미디어가 성장을 견인해야 한다는 점\n* 명확하고 일관된 마케팅 전략이 필요하다는 점\n\n하지만 다음과 같은 점은 알기 어려울 수 있습니다.\n* 우리 브랜드가 무엇으로 알려져야 하는가?\n* 어떤 콘텐츠 핵심 기둥(Pillar)에 집중해야 하는가?\n* 어떤 주제가 적합한 잠재 고객을 끌어들일 수 있는가?\n* 고객의 관심을 어떻게 리드나 실제 고객 전환으로 연결할 것인가?\n\nNaise AI는 이 모든 과정을 관리할 수 있도록 돕습니다.\n\n조사 및 전략 수립부터 콘텐츠 제작, 예약, 발행 및 성과 분석에 이르기까지, Naise AI는 언제나 깨어있는 소셜 미디어 마케팅 파트너처럼 작동합니다.\n\n**Naise AI만의 차별점**\n* 🔌 소셜 미디어 플랫폼에 직접 연결되어 일반 AI 도구가 놓치기 쉬운 심층 인사이트를 발굴합니다.\n* 🧠 방대한 양의 소셜 미디어 및 마케팅 데이터로 학습된 마케팅 특화 모델 기반으로 구축되었습니다.\n* 🏢 제안을 내놓기 전에 비즈니스, 브랜드, 타깃 고객 및 목표를 먼저 깊이 이해합니다.\n* 👥 단순한 또 하나의 AI 도구가 아니라 마케팅 팀의 일원처럼 긴밀히 협력합니다.\n* 🌍 자체 계정뿐 아니라 경쟁사, 트렌드, 뉴스 및 관련 대화를 분석하여 더 넓은 시야를 확보합니다.\n* ✍️ 조사와 전략을 실제 스크립트, 캡션, 이미지 및 콘텐츠 아이디어로 구현합니다.\n* 🔄 실제 성과 데이터를 학습하여 지속적으로 개선 방안을 제안합니다.\n\n**작동 방식**\n1. **비즈니스에 대해 Naise AI에 알려주세요** 🏢\n브랜드, 제품, 타깃층, 목표 및 브랜드 보이스 톤을 학습합니다.\n\n2. **마케팅 환경을 조사합니다** 🔍\n소셜 미디어 현황, 경쟁사, 레퍼런스, 업계 뉴스 및 온라인 대화를 분석합니다.\n\n3. **무엇이 효과적인지 분석합니다** 📈\n콘텐츠 기둥, 성공적인 후킹 포인트, 포맷, 최적 게시 시간 및 개선 영역을 식별합니다.\n\n4. **트렌드와 콘텐츠 기회를 포착합니다** 🔥\n비즈니스와 밀접한 바이럴 영상, 트렌딩 토픽, 시의성 있는 뉴스와 아이디어를 발굴합니다.\n\n5. **콘텐츠 제작을 돕습니다** ✍️\n브랜드와 최신 트렌드를 바탕으로 스크립트, 캡션, 아이디어, 이미지를 생성합니다.\n\n6. **기획과 발행을 지원합니다** 🗓️\n최적 게시 시간을 추천하고 캡션을 준비하여 콘텐츠 스케줄링 및 게시를 돕습니다.\n\n7. **성과를 모니터링합니다** 👀\n성과를 추적하고 다음에 개선해야 할 점에 대한 제안을 제공합니다.\n\n8. **출시 예정: 원클릭 광고 및 영상 생성** 🎬\n수작업을 줄이고 캠페인에 바로 투입 가능한 광고와 영상을 생성합니다.\n\nNaise AI가 소셜 미디어의 부담을 덜어주므로 여러분은 비즈니스 자체에 집중할 수 있고, 콘텐츠는 멈추지 않고 계속 돌아갑니다.\n\n**대상 및 혜택 🎁**\n1인 창업자부터 확장 중인 에이전시까지, Naise는 주당 40시간 이상을 절약하고 마케팅 비용을 최대 80% 절감할 수 있도록 설계되었습니다.\n\n오늘 모든 분들께 조건 없는 3일 무료 체험을 제공합니다. 별도 프로모션 코드는 필요하지 않습니다!\n\n🔗 **무료 체험 시작하기:** https://naise.ai/\n\n저희는 아직 극초기 단계이며 완벽과는 거리가 있습니다. 과도한 업무에 지친 마케터들이 살아남기 위해 진정으로 필요한 것을 만들고자 합니다.\n\n세 가지 에이전트 중 어떤 것을 먼저 배포해보고 싶으신가요? 댓글로 알려주세요. 오늘 하루 종일 머물며 답변드리겠습니다!"

     "author": "Sherif Assaf",
     "is_maker": true,
     "text": "Hey Product Hunt 👋\n\nI'm Sherif Assaf, co-founder and CPO for Pactto.  \n  \nToday is a big day for us. \n\nAfter months of building, testing, questioning, redesigning, and rebuilding closely with our community…\n\n**Pactto is live in Beta 🚀**\n\nPactto started from a frustration we kept seeing again and again:\n\nAI-generated assets are accelerating creative output, pushing teams to take ideas from concept to production across more channels, formats, and variations faster than ever before. **But human alignment remains the bottleneck in that process.**\n\nAssets live everywhere. Feedback is scattered across meetings, Slack, comments, and recordings. Decisions lose context. And edits still have to be carried manually across too many tools.\n\n**And that’s why we built Pactto.**  \nPactto is an AI-native room where creative teams meet, align and AI agents make changes live in one persistent room.\n\nSo with Pactto:\n\n**Your Project lives in one persistent room**, where teams can bring all assets together in an infinite multiplayer canvas, organize them and review them live in high-quality synchronized playback.\n\n**Feedback stays connected to the work.** Pactto listens to the conversation, understands what you’re referring to, and captures feedback in context while everyone is still there.\n\n**AI doesn’t just summarize. It acts.** Pactto’s agents understand your intent and can turn voice feedback into edits, suggestions, tasks, and actions. **Say it. Watch it change.**\n\n **The room remembers what meetings forget.** Every asset, conversation, decision, task, and open question becomes part of the project memory. Come back tomorrow and Pactto knows where the work left off.\n\nWe’re so grateful to the community that helped shape Pactto. Now we're most excited to see how people continue to use it, what works, what doesn’t, and what we need to make better.\n\nAs Demian mentioned, please reach out to him or myself ([sherif@pactto.com](mailto:sherif@pactto.com)) with any feedback or suggestions.\n\nThank You!",
     "kr": "Product Hunt 여러분 안녕하세요 👋\n\nPactto의 공동창업자 겸 CPO Sherif Assaf입니다.\n\n오늘은 저희에게 매우 뜻깊은 날입니다.\n\n커뮤니티와 함께 긴밀히 개발하고, 테스트하고, 고민하고, 재설계하고, 다시 빌드하기를 수개월…\n\n**Pactto가 마침내 오픈 베타로 공개되었습니다 🚀**\n\nPactto는 저희가 지속적으로 목격했던 하나의 좌절감에서 시작되었습니다.\n\nAI가 생성한 에셋들이 크리에이티브 결과물을 가속화하여 팀이 아이디어를 컨셉에서 프로덕션까지 더 많은 채널과 포맷, 다양한 바리에이션으로 전례 없이 빠르게 추진하도록 만들고 있습니다. **하지만 인간 간의 정렬(human alignment)은 여전히 그 과정의 병목으로 남아 있습니다.**\n\n에셋은 사방에 흩어져 있고, 피드백은 미팅, 슬랙, 댓글, 녹화본 전반에 파편화되어 있습니다. 의사결정의 맥락은 유실되고, 수정 사항은 여전히 너무 많은 도구 사이를 수작업으로 옮겨 다녀야 합니다.\n\n**이것이 바로 저희가 Pactto를 만든 이유입니다.**\nPactto는 크리에이티브 팀이 만나 정렬하고 AI 에이전트가 단 하나의 영구 룸에서 실시간으로 변경 사항을 적용하는 AI 네이티브 공간입니다.\n\nPactto와 함께라면:\n\n**프로젝트가 단 하나의 영구적인 룸에 상주합니다.** 팀은 무한한 멀티플레이어 캔버스에 모든 에셋을 모아 정리하고, 고화질 동기화 재생으로 실시간 검토할 수 있습니다.\n\n**피드백이 작업물과 분리되지 않고 연결되어 유지됩니다.** Pactto는 대화를 경청하고 사용자가 무엇을 가리키는지 이해하여, 모든 사람이 여전히 참여하고 있는 상태에서 맥락에 맞게 피드백을 기록합니다.\n\n**AI는 단순히 요약만 하지 않고 직접 행동합니다.** Pactto의 에이전트는 사용자의 의도를 파악하여 음성 피드백을 편집, 제안, 작업 및 실행 가능한 액션으로 전환합니다. **말하면, 실시간으로 바뀌는 것을 볼 수 있습니다.**\n\n**미팅이 끝나면 잊혀지는 것들을 룸이 기억합니다.** 모든 에셋, 대화, 의사결정, 태스크, 미해결 질문이 프로젝트 메모리의 일부가 됩니다. 다음 날 돌아와도 Pactto는 작업이 어디서 멈췄는지 정확히 알고 있습니다.\n\nPactto를 다듬는 데 도움을 준 커뮤니티에 진심으로 감사드립니다. 이제 사람들이 이 도구를 어떻게 계속 사용할지, 무엇이 잘 작동하고 무엇이 부족하며 어떤 점을 개선해야 할지 지켜보는 것이 가장 기대됩니다.\n\nDemian이 말씀드렸듯 피드백이나 제안이 있다면 저(sherif@pactto.com)나 Demian에게 언제든 연락해 주세요.\n\n감사합니다!"

     "author": "César M.",
     "is_maker": true,
     "text": "Hey Product Hunt 👋 I’m César, founder of Latitude.  \n  \nOver the past year, we’ve spoken with many teams running AI agents in production. Across all those conversations, one question kept coming up:  \n  \nIs your agent getting better over time?  \n  \nMost teams could answer for a few regression tests or isolated metrics, but not for the whole agent. Current eval systems have a coverage problem.  \n  \nThat’s why we built Agent Score.  \n  \nConnect your production traces and Latitude automatically evaluates your agent across:  \n  \n• Outcome  \n  \n• Reliability  \n  \n• Cost  \n  \n• Speed  \n  \n• Safety  \n  \nIt brings everything together into one quality score that updates daily, so you can see whether your agent is improving, what’s lowering its score, and the production sessions behind every result.  \n  \nFrom there, Latitude helps you investigate recurring failures, track them over time, and send the evidence to your coding agent to open a fix.  \n  \nWe’d love for you to try Agent Score and tell us what you think. Any feedback is more than welcome 🙏",
     "kr": "Product Hunt 여러분 안녕하세요 👋 Latitude의 창업자 César입니다.\n\n지난 1년 동안 프로덕션 환경에서 AI 에이전트를 운영하는 수많은 팀들과 이야기를 나누었습니다. 그 모든 대화에서 항상 한 가지 질문이 반복해서 나왔습니다.\n\n'여러분의 에이전트는 시간이 지남에 따라 점차 개선되고 있습니까?'\n\n대부분의 팀은 몇 가지 회귀 테스트나 개별 지표에 대해서는 답할 수 있었지만, 에이전트 전체에 대해서는 답하지 못했습니다. 현재의 평가 시스템들은 커버리지 한계 문제를 안고 있기 때문입니다.\n\n이것이 바로 저희가 Agent Score를 만든 이유입니다.\n\n프로덕션 실행 트레이스를 연결하면 Latitude가 다음 5가지 영역에 걸쳐 에이전트를 자동으로 평가합니다.\n• 결과 품질 (Outcome)\n• 신뢰성 (Reliability)\n• 비용 (Cost)\n• 속도 (Speed)\n• 안전성 (Safety)\n\n이 모든 것을 매일 업데이트되는 단일 품질 점수로 통합하여, 에이전트가 개선되고 있는지, 무엇이 점수를 깎아먹고 있는지, 그리고 각 결과 뒤에 있는 프로덕션 세션을 한눈에 확인할 수 있습니다.\n\n여기서 더 나아가 Latitude는 반복되는 장애 요인을 조사하고 시간에 따라 추적하며, 증거 자료를 코딩 에이전트에 전달하여 버그 수정 PR을 생성할 수 있도록 지원합니다.\n\nAgent Score를 직접 사용해 보시고 의견을 들려주시면 감사하겠습니다. 어떤 피드백이든 두 팔 벌려 환영합니다 🙏"

     "kr": "[@heycesr](https://www.producthunt.com/@heycesr) 님, [@paula\\_cavero](https://www.producthunt.com/@paula_cavero) 님 #AgentScore 출시를 축하드립니다 🌟✌️. 빠른 질문 하나 드리자면, 프로덕션 에이전트를 연동할 때 별도의 코딩 작업이 필요한가요, 아니면 수동적인(패시브) 연동에 가까운가요?"

     "is_maker": false,
     "text": "the \"one score across outcome/reliability/cost/speed/safety\" framing is useful but also where I'd worry about a single number hiding a tradeoff, an agent that gets faster and cheaper by being slightly less reliable could show a flat or improving score if the weighting favors cost. do you expose the five sub-scores individually as well, or is the daily score genuinely a blend with no visibility into which dimension moved",
     "kr": "'결과/신뢰성/비용/속도/안전성을 아우르는 단일 점수'라는 프레임워크는 유용하지만, 동시에 단 하나의 숫자가 트레이드오프를 숨길 수 있다는 점이 우려됩니다. 예를 들어 신뢰성이 약간 떨어지는 대신 더 빠르고 저렴해진 에이전트는 가중치가 비용 쪽으로 치우칠 경우 점수가 유지되거나 오히려 향상되는 것처럼 보일 수 있으니까요. 5가지 하위 점수도 개별적으로 공개되나요, 아니면 일일 점수가 어느 차원이 변했는지 파악할 수 없는 단순 혼합치인가요?"

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div></div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
renderToolbar();renderGrid();
</script>
</body>
</html>
