<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Hunt 데일리 — 목록</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--sub:#5c6470;--line:#e6e9ee;--acc:#da552f;--chip:#eef1f5;--danger:#d64545}
@media (prefers-color-scheme: dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8eaee;--sub:#9aa3af;--line:#2a2f38;--acc:#ff6b3d;--chip:#262b33;--danger:#ff7b7b}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:90px}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top a{color:var(--acc);text-decoration:none;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px}
h1{font-size:24px;font-weight:800;margin-top:14px;letter-spacing:-.3px}
.sub{color:var(--sub);font-size:14px;margin-top:2px}
.manage{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:14px;font-weight:600}
.switch{position:relative;width:42px;height:24px;background:var(--chip);border-radius:999px;cursor:pointer;transition:.2s;border:none}
.switch.on{background:var(--acc)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:21px}
.day{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px;text-decoration:none;color:var(--ink);transition:.15s;cursor:pointer}
.day:hover{border-color:var(--acc);transform:translateY(-1px)}
.day .date{font-size:16px;font-weight:800;min-width:96px}
.day .date small{display:block;color:var(--sub);font-weight:500;font-size:12px}
.day .info{flex:1;font-size:13px;color:var(--sub)}
.day .info b{color:var(--ink)}
.day .arrow{color:var(--sub)}
.day input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);display:none}
body.manage .day input[type=checkbox]{display:block}
body.manage .day{cursor:default}
.empty{text-align:center;color:var(--sub);padding:50px 0}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:none;justify-content:center;gap:12px;align-items:center;z-index:40}
body.manage .bar{display:flex}
.bar button{border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer}
.bar .del{background:var(--danger);color:#fff}
.bar .cancel{background:var(--chip);color:var(--ink)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;transition:.25s;opacity:0;z-index:99;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%);opacity:1}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 style="margin-top:0">🚀 Product Hunt 데일리</h1><a href="/">🏠 허브</a></div>
  <div class="sub">매일 PH 오늘의 Top 5 · 댓글까지 읽는 데일리 브리핑</div>
  <div class="manage"><button class="switch" id="sw" aria-label="관리 모드"></button> 관리 모드 <span style="color:var(--sub);font-weight:400;font-size:12px">(삭제는 관리 모드에서)</span></div>
  <div id="list"></div>
  <footer>workkrst.github.io/ph-daily · 자동 수집 (매일 12:30 KST)</footer>
</div>
<div class="bar"><span id="selinfo" style="font-size:13px;color:var(--sub)">0개 선택</span><button class="del" id="del">🗑 삭제 요청 복사</button><button class="cancel" id="cancel">취소</button></div>
<div class="toast" id="toast"></div>
<script src="list-data.js"></script>
<script>
const $=s=>document.querySelector(s);const list=(window.PH_DAILY_LIST||[]);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
const WD=['일','월','화','수','목','금','토'];
const el=$('#list');
if(!list.length){el.innerHTML='<div class="empty">아직 수집된 날이 없습니다.</div>'}
list.forEach(it=>{
 const d=new Date(it.date+'T00:00:00');
 const a=document.createElement('a');a.className='day';a.href=it.url;
 a.innerHTML=`<input type="checkbox" data-date="${it.date}"><div class="date">${it.date.slice(5).replace('-','/')}<small>${WD[d.getDay()]}요일</small></div><div class="info">🥇 <b>${it.top_product}</b> 외 ${it.count-1}개 · ▲ ${it.upvotes_total} · 💬 ${it.comments_total}</div><span class="arrow">→</span>`;
 el.appendChild(a);
});
const sw=$('#sw');
sw.onclick=()=>{document.body.classList.toggle('manage');sw.classList.toggle('on');if(!document.body.classList.contains('manage')){document.querySelectorAll('#list input').forEach(c=>c.checked=false);upd()}};
function upd(){const n=document.querySelectorAll('#list input:checked').length;$('#selinfo').textContent=n+'개 선택';$('#del').disabled=!n;$('#del').style.opacity=n?1:.5}
$('#list').addEventListener('change',upd);
$('#cancel').onclick=()=>{document.querySelectorAll('#list input').forEach(c=>c.checked=false);upd()};
$('#del').onclick=async()=>{
 const ds=[...document.querySelectorAll('#list input:checked')].map(c=>c.dataset.date);
 const msg='ph-daily 리포트 삭제 요청: '+ds.join(', ');
 try{await navigator.clipboard.writeText(msg);toast('복사 완료! 이 문장을 텔레그램 수행비서에게 보내면 삭제됩니다:\n'+msg)}
 catch(e){toast('복사 실패 — 직접 보내주세요: '+msg)}
};
upd();
</script>
</body>
</html>
