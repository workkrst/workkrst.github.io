a{color:var(--acc)}

.dq-lnk{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--acc);text-decoration:none;white-space:nowrap}

     "text": "Hi everyone, I'm Elle, and I work on product and go-to-market for zCAD.\n\nThe question we kept coming back to: where is this model going to live? If it lives in a game, a render or a virtual world, a mesh is the right answer, and AI 3D tools already do it well. If it has to work in the physical world, fit another part, take a screw, get printed or machined, it needs CAD: real dimensions, solid geometry, parts that mate.\n\nzCAD. AI generates that from a prompt, and exports STEP into the tool you already use.\n\nOn the product side, a few choices are deliberate. Even the free plan exports STEP, because a part you can't take into your own tools isn't really yours. We turn down figurine requests, because sculpted, organic shapes are what mesh does best, even when you print them. And it doesn't make engineering calls for you. Tolerances and materials stay with you.\n\nOn the go-to-market side, I'll be honest: we're still learning who needs this most. Makers who 3D print, indie hardware designers, engineers who live in CAD all day? That's a big part of why we're here. Try it on something that has to work in the real world, and tell us who you are and where it breaks.\n\nUpvote (6)",

     "author": "X Z",
     "is_maker": true,
     "text": "Hi Product Hunt, I’m Xin and I work on zCAD 👋\n\nI got into CAD because the step from a flat 2D sketch to a solid 3D object always struck me as a kind of magic. Underneath it there’s a quiet mathematical beauty: constraints, dimensions, geometry that holds together exactly. But reaching that magic has always meant learning a lot of software before you’re allowed to make anything, and that’s where most people give up. So I kept asking myself: is there a better way into the same process, one that keeps the precision and removes the barrier?\n\nWith zCAD, you describe what you need in plain words, get a real solid model with real dimensions, and send it straight to your 3D printer.\n\nTo be clear about what it’s for: zCAD won’t sculpt your figurine. Mesh tools already do that beautifully. What it makes is the stand that fits that figurine’s base and stops it tipping over. The pencil case sized for your kid’s pencils, the week before school starts. Small, practical things that have to fit something real.\n\nNone of those are engineering projects. They’re just things you want to exist, and until now they cost an afternoon of fighting software you’d open twice a year. I want that afternoon to become a sentence.\n\nSo try it on something small from your own life, and tell me what you made and where it got it wrong. I’ll be here all day reading every reply. ❤️",

     "author": "gzzeaon",
     "is_maker": true,
     "text": "Hey everyone! I’m gzzeason, a software engineer on the product team at zCAD. 😊  \nWe’re building zCAD to make it easier for engineers, designers, and makers to turn ideas into editable 3D CAD models. Our goal is simple: help you spend less time on repetitive modeling steps and more time developing and refining your designs.  \nWith zCAD, you can describe a part or assembly in plain language and add a reference image to help communicate your idea. AI turns that input into a parametric CAD model, with dimensions, features, and assembly relationships you can inspect and refine. From there, you can request changes through follow-up instructions, continue editing in zCAD Online, or export your model in formats such as STEP to keep working in other CAD software.  \nWe’d be interested to hear how this fits into your own work: like what you’d use it for, and where it falls short. If you try it and get an unexpected result, send us the prompt and what you were trying to create. Those examples help us figure out what to work on next.",
     "kr": "안녕하세요 여러분! 저는 zCAD 제품 팀의 소프트웨어 엔지니어 gzzeason입니다. 😊\n\n저희는 엔지니어, 디자이너, 메이커가 아이디어를 편집 가능한 3D CAD 모델로 더 쉽게 전환할 수 있도록 zCAD를 구축하고 있습니다. 저희 목표는 간단합니다. 반복적인 모델링 단계에 드는 시간을 줄이고, 디자인을 개발하고 다듬는 데 더 많은 시간을 쓸 수 있도록 돕는 것입니다.\n\nzCAD를 사용하면 일반적인 언어로 부품이나 어셈블리를 설명하고 참조 이미지를 추가하여 아이디어를 전달할 수 있습니다. AI가 해당 입력을 치수, 피처, 검사 및 수정 가능한 어셈블리 관계를 갖춘 파라메트릭 CAD 모델로 변환합니다. 거기서부터 후속 지시를 통해 변경을 요청하거나, zCAD Online에서 편집을 이어가거나, STEP 등의 형식으로 모델을 내보내 다른 CAD 소프트웨어에서 작업을 계속할 수 있습니다.\n\n이것이 여러분의 업무에 어떻게 맞는지 듣고 싶습니다. 어떤 용도로 사용하실지, 그리고 어떤 점이 부족한지요. 시도해 보시고 예상치 못한 결과가 나온다면 프롬프트와 만들고자 했던 내용을 보내주세요. 이러한 사례들은 저희가 다음에 무엇을 작업해야 할지 결정하는 데 큰 도움이 됩니다."

     "author": "Ruan YangMing",
     "is_maker": true,
     "text": "Hey Product Hunt! 👋 I’m part of the design team behind [zCAD.AI](http://zcad.ai/).  \nAs a designer, my hope for [zCAD.AI](http://zcad.ai/) is to give people more freedom to explore ideas and more ability to turn them into something real.  \nCAD gives us powerful, precise tools, but using them often means translating an idea into a long sequence of commands. I’m excited about a future where we can start by expressing what we want to achieve, and AI helps us work through how to get there—with professional tools always within reach.  \nToday, our first step is generating parametric CAD models from images or text. We see this as the beginning of a broader collaboration: people bring intent, experience, and judgment; AI helps develop possibilities and move the work forward.  \nFor me, this is also an exciting direction for AI: helping people create things they can understand, edit, and build upon. In engineering, that means working toward results people can inspect and verify, with control over how their designs evolve.  \nI hope this makes CAD more approachable for newcomers and gives experienced designers more room to explore alternatives, solve harder problems, and spend time on the decisions that matter.  \nThat’s the future we want to help build with [zCAD.AI](http://zcad.ai/). What would you want an AI collaborator to help you achieve in CAD?",
     "kr": "Product Hunt 여러분 안녕하세요! 👋 저는 zCAD.AI의 디자인 팀 일원입니다.\n\n디자이너로서 zCAD.AI에 거는 제 바람은 사람들이 아이디어를 더 자유롭게 탐색하고 이를 실제 실물로 전환할 수 있는 능력을 더 많이 얻는 것입니다.\n\nCAD는 강력하고 정밀한 도구를 제공하지만, 이를 사용한다는 것은 종종 하나의 아이디어를 긴 일련의 명령어로 번역하는 작업을 의미했습니다. 저는 우리가 무엇을 달성하고자 하는지 표현하는 것으로 시작하고, 전문 도구를 언제든 사용할 수 있는 상태에서 AI가 그곳에 도달하는 과정을 함께 풀어나가는 미래를 기대하고 있습니다.\n\n오늘 저희의 첫걸음은 이미지나 텍스트로부터 파라메트릭 CAD 모델을 생성하는 것입니다. 저희는 이것을 더 넓은 협업의 시작으로 봅니다. 사람은 의도와 경험, 판단력을 가져오고, AI는 가능성을 개발하며 작업을 진전시키는 데 도움을 줍니다.\n\n저에게 이것은 AI의 흥미로운 방향성이기도 합니다. 사람들이 이해하고, 편집하고, 그 위에 발전시킬 수 있는 것을 만들도록 돕는 것이죠. 엔지니어링에서는 디자인이 발전하는 방식을 제어하면서 검사하고 검증할 수 있는 결과를 지향하는 것을 의미합니다.\n\n이로 인해 초보자에게는 CAD가 더 친숙해지고 숙련된 디자이너에게는 대안을 탐색하고, 더 어려운 문제를 해결하며, 중요한 결정에 시간을 쓸 수 있는 여유가 더 많이 생기기를 바랍니다.\n\n그것이 바로 저희가 zCAD.AI를 통해 구축하고자 하는 미래입니다. 여러분은 AI 협업자가 CAD에서 무엇을 달성하도록 돕기를 원하시나요?"

     "is_maker": true,
     "text": "Hey Product Hunt! 👋\n\nI'm Misha, cofounder and CEO of [**myPip**](https://mypip.dev/), vibe coding for video games.\n\nMost of us grew up with a game idea in our heads that never got made. Game engines are powerful, but they're intimidating, and \"learn C# first\" kills most ideas before they start. We built myPip so anyone can describe a game in plain English and be playing it minutes later.\n\n**What you can do with myPip:**\n\n🎮 **Vibe code a game.** Describe it, play it, mod it by just saying what you want changed.\n\n🐝 **Hive coding.** This is the one we're most excited about. It's multiplayer game _creation_: you and your friends build the same game together in real time. One person adds a boss, another rewrites the physics, someone else is already playtesting.\n\n👾 **Multiplayer built in.** Games you make can be played with friends, no netcode required.\n\n🕹️ **Controller connect.** Plug in a PS5, Xbox, or Wii controller and your game feels like a real console game.\n\n🤳 **Scan yourself in.** Put yourself (or your friends) into the game as a character.\n\n🤖 **MCP server.** Build myPip games straight from your favorite AI chatbot.\n\nMore than 140,000 people have already made games on myPip, and watching what they come up with has been the best part of building this.\n\nTry it at [**mypip.dev**](http://mypip.dev/). I'll be here all weekend, so tell me what you build, what breaks, and what you want next. And if you start a hive coding lobby, send me the link. I'd love to jump in. 🐝\n\nUpvote (9)",
     "kr": "Product Hunt 여러분 안녕하세요! 👋\n\n저는 비디오 게임을 위한 바이브 코딩 플랫폼 myPip의 공동 창업자이자 CEO인 Misha입니다.\n\n우리 대부분은 마음속에 끝내 만들어지지 못한 게임 아이디어를 하나씩 품고 자랐습니다. 게임 엔진은 강력하지만 다루기 까다롭고, 'C#부터 먼저 배워라'라는 말은 시작하기도 전에 대부분의 아이디어를 꺾어버립니다. 저희는 누구나 쉬운 영어로 게임을 설명하고 몇 분 만에 직접 플레이할 수 있도록 myPip을 만들었습니다.\n\n**myPip으로 할 수 있는 것들:**\n\n🎮 **게임 바이브 코딩:** 아이디어를 설명하고, 플레이해 보고, 변경하고 싶은 내용을 말하는 것만으로 모드를 수정하세요.\n\n🐝 **하이브 코딩(Hive coding):** 저희가 가장 기대하고 있는 기능입니다. 멀티플레이어 게임 '제작' 환경으로, 친구들과 함께 실시간으로 같은 게임을 만듭니다. 한 사람이 보스를 추가하는 동안 다른 사람은 물리 법칙을 다시 작성하고, 또 다른 사람은 이미 플레이테스트를 진행하고 있죠.\n\n👾 **기본 내장된 멀티플레이어:** 복잡한 넷코드 작업 없이도 친구들과 함께 플레이할 수 있는 게임을 만듭니다.\n\n🕹️ **컨트롤러 연결:** PS5, Xbox, Wii 컨트롤러를 연결하면 실제 콘솔 게임처럼 즐길 수 있습니다.\n\n🤳 **자신을 스캔해 넣기:** 본인(또는 친구)을 게임 속 캐릭터로 직접 등장시키세요.\n\n🤖 **MCP 서버:** 자주 사용하는 AI 챗봇에서 곧바로 myPip 게임을 제작할 수 있습니다.\n\n이미 140,000명 이상의 사용자가 myPip에서 게임을 만들었으며, 그들이 만들어내는 결과물을 지켜보는 것이 이 프로젝트를 개발하면서 가장 즐거운 순간이었습니다.\n\nmypip.dev에서 직접 체험해 보세요. 주말 내내 여기서 여러분이 무엇을 만드셨는지, 어디서 버그가 나는지, 다음에 무엇을 원하는지 의견을 듣겠습니다. 하이브 코딩 로비를 여신다면 링크를 보내주세요, 기꺼이 참여하겠습니다. 🐝"

     "text": "**1Password for Agents** lets supported AI agents sign in to your accounts without ever seeing your passwords.\n\n**Problem:** Personal AI agents increasingly need to log in to sites and apps to get things done, like completing a purchase or working in your accounts. The easy way is to hand over your passwords, which is risky, since you can’t control what the agent does with them.\n\n**Solution:** When an agent reaches a login screen, it asks 1Password for the credential. You approve or deny the request in 1Password, and 1Password fills in the password or one-time code directly. The agent only sees that access was granted.\n\n**What makes it different:** The agent never receives your credentials, and approval happens on your own device. Per 1Password, the agent proves its identity with a unique digital key, and connecting an agent doesn’t give it access to your whole vault, which stays end-to-end encrypted. If several saved logins match, you choose which one gets used.\n\n**Key features:**\n\n*   Agentic Autofill: a supported agent signs in through a browser without handling the password\n    \n*   Approve or deny each access request in 1Password\n    \n*   New account details can be saved to your vault\n    \n*   Connect one or several supported agents\n    \n*   Rolling out with Meta Muse and Grok Bot, with another integration in the works\n    \n*   Included in all Individual and Family plans\n    \n\n**Who it’s for:** People who use personal AI agents and want them to handle logins without giving up their passwords.\n\nUpvote (2)",
     "kr": "**1Password for Agents**는 지원되는 AI 에이전트가 여러분의 비밀번호를 직접 보지 않고도 계정에 로그인할 수 있도록 지원합니다.\n\n**문제점:** 개인용 AI 에이전트가 구매를 완료하거나 계정 내에서 작업을 처리하기 위해 웹사이트 및 앱에 로그인해야 하는 경우가 점점 늘어나고 있습니다. 가장 쉬운 방법은 비밀번호를 넘겨주는 것이지만, 에이전트가 그 비밀번호로 무엇을 할지 통제할 수 없기 때문에 매우 위험합니다.\n\n**해결책:** 에이전트가 로그인 화면에 도달하면 1Password에 자격 증명을 요청합니다. 사용자는 1Password에서 해당 요청을 승인하거나 거절하며, 승인 시 1Password가 비밀번호나 일회용 코드를 직접 입력합니다. 에이전트는 접근 권한이 부여되었다는 사실만 알 수 있습니다.\n\n**차별점:** 에이전트는 사용자의 자격 증명을 절대 전달받지 않으며 승인은 사용자의 기기에서 이루어집니다. 1Password에 따르면 에이전트는 고유한 디지털 키로 신원을 증명하며, 에이전트를 연결해도 종단간 암호화된 전체 금고에는 접근할 수 없습니다. 일치하는 저장된 로그인이 여러 개인 경우 사용자가 사용할 항목을 직접 선택합니다.\n\n**주요 기능:**\n* 에이전틱 자동완성(Agentic Autofill): 지원되는 에이전트가 비밀번호를 직접 다루지 않고 브라우저를 통해 로그인\n* 1Password에서 각 접근 요청을 개별적으로 승인 또는 거부\n* 새로운 계정 세부 정보를 금고에 자동 저장 가능\n* 하나 또는 여러 개의 지원되는 에이전트 연결 가능\n* Meta Muse 및 Grok Bot을 시작으로 순차 배포 중이며 추가 연동 준비 중\n* 모든 개인(Individual) 및 가족(Family) 플랜에 기본 포함\n\n**대상 사용자:** 비밀번호를 넘겨주지 않고도 개인용 AI 에이전트가 로그인을 대신 처리하기를 원하는 사용자."

   "launch_url_used": "https://canva.com/?ref=producthunt",
   "comment_summary": "헌터 Kate Ramakaieva는 기존 AI 이미지 모델들이 겪던 텍스트 뭉개짐과 레이아웃 제어 문제를 해결한 Canva의 첫 자체 이미지 생성 모델 Canva Craft 출시를 소개했습니다. 55개 언어의 선명한 텍스트 렌더링과 함께 결과물을 개별 레이어로 분리해 캔바 에디터에서 자유롭게 수정할 수 있는 실용성을 강조했습니다. 또한 30개 이상의 규격 비율 지원과 API 제공을 통해 일상적인 마케팅 그래픽 제작 워크플로우를 혁신할 수 있음을 전했습니다.",

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="lnk" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="lnk" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">💬 PH에서 보기</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
(function(){
 const dq=DATA.disquiet;
 if(!dq||!dq.length)return;
 const sec=$('#dqsec');
 const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const hr=document.createElement('hr');
 hr.className='dq-divider';
 sec.appendChild(hr);
 const head=document.createElement('div');
 head.className='dq-header';
 head.innerHTML=`<h2>🇰🇷 디스콰이엇 신규 프로덕트 ${dq.length}건</h2><div class="dq-sub">disquiet.io 신규 등록 · 한줄 코멘트는 AI 요약</div>`;
 sec.appendChild(head);
 const g=document.createElement('div');
 g.className='grid';
 dq.forEach(p=>{
  const c=document.createElement('div');
  c.className='card dq-card';
  const cmtHtml=p.comment?`<div class="dq-cmt">💡 ${esc(p.comment)}</div>`:'';
  c.innerHTML=`<div class="dq-head"><div class="dq-name">${esc(p.name)}</div><div class="up">▲ ${p.upvotes!=null?p.upvotes:0}</div></div>`+
   `<div class="dq-tag">${esc(p.tagline)}</div>`+
   cmtHtml+
   `<div class="dq-foot"><a class="lnk dq-lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">💬 디스콰이엇에서 보기</a></div>`;
  c.onclick=()=>{if(p.url)window.open(p.url,'_blank','noopener,noreferrer')};
  g.appendChild(c);
 });
 sec.appendChild(g);
})();
renderToolbar();renderGrid();
</script>
</body>
</html>
