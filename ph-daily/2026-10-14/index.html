     "author": "David Tedaldi",
     "is_maker": true,
     "text": "📌\n\nHey Product Hunt 👋\n\nToday we’re launching Kai, and I want to share a bit about why we built it.\n\n**Every founder and team lead has two jobs!**\n\nWe’ve spent more than five years in productivity building Morgen, and we kept hearing the same thing from founders and team leads. They all juggle two jobs:\n\n1.  The job they were hired to do\n    \n2.  Everything around it: managing coordination across people, the back-and-forth, jumping between calls, scheduling meetings, answering emails, chasing people\n    \n\nThe second job quietly eats the first one. **We built Kai for the second job.**\n\n**Why now**\n\nAI tools like Claude and ChatGPT get more capable every month. But they still wait for you to ask, and they don’t really know you. They don’t see the promise you made on Tuesday’s call, the reply you’re still waiting on, or the clash hiding in next week’s calendar. That context lives in your meetings, your email and your calendar, and that’s exactly where Kai works.\n\nHonestly, I’m sick of hearing about CLIs, MCPs and connected workflows. I just wanted to build an extremely simple, delightful personal assistant that gives people back hours every day, without asking them to become prompt engineers.\n\n**AI deserves a real interface**\n\nI’m a big UI and UX nerd. Every AI product I’ve tried was either a chat bar stuck onto an existing app, or a plain chat with almost no interface. We set out to make Kai the first AI that gets both right: an agent you can talk to, and a UI that’s a joy to use.\n\nSo Kai doesn’t wait to be asked. It shows up with a question and a fix ready:\n\n📩 _“Jim wants to push the 2:00 investor call by 30 minutes. You’re free at 2:30. Should I move it and draft a reply?”_ One tap, and you press Send.\n\n🎙️ You say “I’ll build the Q3 deck tonight” on a call, and it’s on your task list before you hang up, ready to hand to Claude with the meeting context attached.\n\n☀️ You ask the same question every morning, and Kai offers to just brief you at 8 am instead.\n\nNothing goes out without you. Kai drafts; you press Send.\n\n**Where we’re going**\n\nThis is day one. Over the next 12 months we’re doubling down on three things: making Kai more proactive, making the experience even more delightful, and expanding what it can take off your plate.\n\n**Try it today 🎁**\n\nKai is free to start on Web, Mac, iPhone, and Android at [hirekai.ai](https://go.hirekai.ai/producthunt) **(every Product Hunter who signs up today gets 2x the trial credits!).**\n\nI’ll be here all day reading every comment, and I’d love to know: **what’s the part of your “second job” you’d hand to Kai first?** 👇\n\nDavid\n\nPS: A huge shoutout to our hundreds of beta users who've showered us with love and feedback over the last few months. We wouldn’t be here without you!",
     "kr": "📌\n\n안녕하세요 Product Hunt 여러분 👋\n\n오늘 저희는 Kai를 출시하며 왜 이 제품을 만들게 되었는지 이야기 나누고자 합니다.\n\n모든 창업자와 팀 리더에게는 두 가지 직업이 있습니다!\n5년 넘게 생산성 분야에서 Morgen을 만들면서 창업자와 팀 리더들로부터 늘 같은 이야기를 들었습니다. 그들은 모두 두 가지 일을 동시에 해내고 있었습니다:\n1. 원래 하기로 한 본업\n2. 그 주변의 모든 일: 사람들과의 조율, 끝없는 연락 주고받기, 연이은 통화, 회의 일정 잡기, 이메일 답장하기, 사람들 재촉하기\n\n두 번째 일이 첫 번째 본업을 조용히 잠식합니다. 저희는 그 두 번째 일을 위해 Kai를 만들었습니다.\n\n왜 지금인가\nClaude나 ChatGPT 같은 AI 도구는 매달 더 강력해지고 있습니다. 하지만 여전히 사용자가 먼저 물어보기를 기다리며, 사용자를 제대로 알지 못합니다. 화요일 통화에서 한 약속이나 아직 기다리고 있는 답장, 다음 주 캘린더에 숨어 있는 일정 충돌을 알지 못하죠. 그 맥락은 여러분의 회의, 이메일, 캘린더 안에 살아 있으며 바로 그곳이 Kai가 작동하는 영역입니다.\n\n솔직히 CLI, MCP, 연결형 워크플로우 이야기는 이제 지겹습니다. 저는 그저 사람들이 프롬프트 엔지니어가 될 필요 없이 매일 몇 시간씩 아껴주는 아주 단순하고 즐거운 개인 비서를 만들고 싶었습니다.\n\nAI에게는 제대로 된 인터페이스가 필요합니다\n저는 UI와 UX에 진심인 사람입니다. 지금까지 써본 모든 AI 제품은 기존 앱에 채팅창만 붙여놓았거나 인터페이스가 거의 없는 단순 채팅뿐이었습니다. 저희는 대화할 수 있는 에이전트와 쓰는 즐거움이 있는 UI 두 가지를 모두 제대로 구현한 첫 번째 AI로 Kai를 만들고자 했습니다.\n\n그래서 Kai는 질문을 기다리지 않고 질문과 해결책을 준비해 먼저 찾아옵니다:\n📩 \"Jim이 2시 투자자 미팅을 30분 미루고 싶어 합니다. 2시 30분에 시간이 비어 있는데 일정을 옮기고 답장 초안을 작성할까요?\" 한 번 탭하고 발송만 누르면 됩니다.\n🎙️ 통화 중에 \"오늘 밤에 3분기 발표자료를 만들게요\"라고 말하면 전화를 끊기도 전에 할 일 목록에 추가되어 회의 맥락과 함께 Claude로 전달할 준비가 끝납니다.\n☀️ 매일 아침 같은 질문을 하면 Kai가 대신 오전 8시에 브리핑해 주겠다고 제안합니다.\n\n사용자 승인 없이는 아무것도 외부로 나가지 않습니다. Kai가 초안을 작성하고, 발송은 여러분이 직접 누릅니다.\n\n향후 계획\n오늘은 시작일 뿐입니다. 앞으로 12개월 동안 Kai를 더욱 능동적으로 만들고, 사용자 경험을 한층 더 즐겁게 개선하며, 대신 처리해 줄 수 있는 업무 범위를 넓히는 데 집중할 것입니다.\n\n오늘 사용해 보세요 🎁\nKai는 웹, Mac, iPhone, Android에서 무료로 시작할 수 있으며 오늘 가입하는 모든 Product Hunt 사용자에게는 체험 크레딧 2배 혜택을 드립니다!\n\n하루 종일 모든 댓글을 읽을 예정이니 여러분의 '두 번째 일' 중 어떤 부분을 가장 먼저 Kai에게 맡기고 싶으신지 알려주세요!"

     "author": "Marco Ancona",
     "is_maker": true,
     "text": "Hi everyone,\n\nI’m Marco, CTO at Kai. First, a big thank you to our entire team. I’m proud of what we’ve achieved together.\n\nKai could build on the battle-tested infrastructure of Morgen, our daily planner used by thousands of people every day. Even so, building Kai brought its own set of challenges:\n\n*   **Balancing text and visual interfaces.** Text is common and expressive, but often hard to digest. Sometimes pressing a button is faster than chatting, so we wanted Kai to offer whichever UX fits each use case best. With Kai, we wanted to reduce the number of tools you need to look at, not add one more. In fact, I think you won't need to look at your Gmail or Outlook anymore.\n    \n*   **Answering with depth, breadth, and speed.** An agent building a product can happily work in the background for half an hour. We wanted Kai to be snappy, like a real assistant. More easily said than done, given the current state of the technology, yet I think we achieved our goal here.\n    \n*   **Aggregating information efficiently, securely, and effectively.** Kai connects the dots between what was said in a meeting and the emails that follow on the same topic weeks later. It also keeps track of your preferences and adapts to your preferred workflows.\n    \n\nWe’re just getting started and I hope you like what we are building. Give it a try and let us know what you think!",
     "kr": "안녕하세요 여러분, Kai의 CTO Marco입니다. 먼저 우리 팀 전원에게 큰 감사를 전하며 함께 이룬 성과가 자랑스럽습니다.\n\nKai는 매일 수천 명이 사용하는 데일리 플래너 Morgen의 검증된 인프라 위에서 구축될 수 있었습니다. 그럼에도 Kai를 만드는 과정에는 고유한 기술적 과제들이 있었습니다:\n- 텍스트와 시각적 인터페이스의 균형: 텍스트는 표현력이 풍부하지만 한눈에 파악하기 어려울 때가 있습니다. 때로는 채팅보다 버튼 하나를 누르는 것이 빠르기 때문에 각 상황에 가장 적합한 UX를 제공하고자 했습니다. 확인해야 할 도구를 하나 더 늘리는 대신 줄이고자 했으며, 실제로 이제 Gmail이나 Outlook을 직접 열어볼 필요가 없을 것이라 생각합니다.\n- 깊이, 넓이, 속도를 갖춘 응답: 제품을 만드는 코딩 에이전트는 백그라운드에서 30분 동안 돌아가도 괜찮지만, 저희는 Kai가 실제 비서처럼 빠릿빠릿하게 반응하기를 원했습니다. 현재 기술 수준에서 말처럼 쉬운 일은 아니었지만 목표를 잘 달성했다고 생각합니다.\n- 효율적이고 안전하며 효과적인 정보 통합: Kai는 회의에서 나온 이야기와 몇 주 뒤 같은 주제로 이어지는 이메일 사이의 맥락을 연결합니다. 또한 사용자의 선호도를 파악해 선호하는 워크플로우에 맞춰 적응합니다.\n\n저희는 이제 막 시작했으며 여러분이 마음에 들어 하셨으면 좋겠습니다. 한번 사용해 보시고 의견을 들려주세요!"

     "text": "I'm super excited to have been testing Kai for a while now as one of it's beta users. The \"go be human\" phrasing of Kai is incredibly accurate. I've always loved what the Kai team built with Morgen, and although i've got the technical know-how to connect up all my tools, when [@dannyhatcher](https://www.producthunt.com/@dannyhatcher) introduced me to what the team were making I was like... oh I can just _do the things._\n\nNow I use Kai for a variety of things, Inbox Management, Food Prep, Study Sessions... Medicine Reminders for all the things you know you've gotta do... but always end up being a little bit slippy.\n\nIt's just nice to have a _single_ place to go to be able to check my calendar, emails and tasks without having to think about the connective tissue behind it.\n\nThat **_plus_** the fact there's an MCP so I can connect with my local agents, means that there's an easy customisable pipeline for me to do the work i gotta do, whilst also juggling life admin, looking after two children, and running a business with multiple moving parts at the same time.\n\nThe clean interface that just works means I don't have to _think_ about _how_ to make it work... it learns what I do, and makes it possible without having to futz around with connectors or... anything else technical... _if you don't wanna._\n\nSure productivity is great and all... but frankly just being able to send a quick message to remember something whilst cooking food and my children ask me for something... and it just appears scheduled in my calendar makes things _far faaar_ easier than it ever used to be....\n\nAnd unlike other tools that _say they do the same things as Kai..._ They are just missing the features or the UI that makes sense for how I work.\n\nCongrats to the team! You all did a fantastic job!",

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="lnk" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="lnk" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">💬 PH에서 보기</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}

 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
(function(){
 const dq=DATA.disquiet;
 if(!dq||!dq.length)return;
 const sec=$('#dqsec');
 const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const hr=document.createElement('hr');
 hr.className='dq-divider';
 sec.appendChild(hr);
 const head=document.createElement('div');
 head.className='dq-header';
 head.innerHTML=`<h2>🇰🇷 디스콰이엇 신규 프로덕트 ${dq.length}건</h2><div class="dq-sub">disquiet.io 신규 등록 · 한줄 코멘트는 AI 요약</div>`;
 sec.appendChild(head);
 const g=document.createElement('div');
 g.className='grid';
 dq.forEach(p=>{
  const c=document.createElement('div');
  c.className='card dq-card';
  const cmtHtml=p.comment?`<div class="dq-cmt">💡 ${esc(p.comment)}</div>`:'';
  c.innerHTML=`<div class="dq-head"><div class="dq-name">${esc(p.name)}</div><div class="up">▲ ${p.upvotes!=null?p.upvotes:0}</div></div>`+
   `<div class="dq-tag">${esc(p.tagline)}</div>`+
   cmtHtml+
   `<div class="dq-foot"><a class="lnk dq-lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">💬 디스콰이엇에서 보기</a></div>`;
  c.onclick=()=>{if(p.url)window.open(p.url,'_blank','noopener,noreferrer')};
  g.appendChild(c);
 });
 sec.appendChild(g);
})();
renderToolbar();renderGrid();
</script>
</body>
