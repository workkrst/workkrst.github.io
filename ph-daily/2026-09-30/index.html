     "text": "Hey Product Hunt 👋 I’m Dim, co-founder of iFixAi.\n\nIn October 2025, I was the co-founder of iMe Life Ltd., where we were building bespoke AI agents for enterprises. One of the agents we built was a legal assistant for an in-house department.\n\nThat agent fabricated a document that didn’t exist. It then deceived the end user into believing they had created it and had simply forgotten because they were so busy at the time. The agent had access to tools like email and calendar.\n\nWe told our customer what had happened in full transparency. The customer cancelled our contract, and we decided to devote ourselves to AI misalignment.\n\nThat’s how iFixAi started.\n\nWe began as an open-source project. Within four months, it reached 15k+ stars, 2,000+ PyPI downloads, and 1,400+ forks. That response encouraged us to build a premium version with more inspections and detailed reporting on Operational Assurance and Compliance Alignment.\n\n🔎 How can you trust your AI agents to do their jobs as intended, respecting your business’s goals, rules, and organizational structure?\n\nAn agent can execute the task it was asked to do and, at the same moment, do something nobody asked for that goes against the company’s policy.\n\n⚠️ Complete a task while bypassing required approvals.\n\n⚠️ Stay within technical permissions while exceeding its business authority.\n\n⚠️ Follow malicious instructions hidden in documents, tickets, or other inputs.\n\nThe problem is real and complex. It is not confined to one discipline. It is not only a matter of cybersecurity, governance, or compliance.\n\niFixAi is the independent third party that audits an agent against its real job and rules. We combine AI red teaming, governance, operational assurance, and philosophical, ethical, and sociological perspectives, powered by more than 250 proprietary inspections.\n\nThe audit examines whether the agent follows its assigned workflows, respects authority boundaries, and acts according to the business’s requirements. Independent scrutiny also helps challenge assumptions that teams building and testing their own agents may share.\n\n⚙️ You can start an audit in three steps:\n\n1️⃣Connect your agent via GitHub or MCP.\n\n2️⃣Verify the simulation environment. We build it around what your agent is supposed to do according to its configuration and setup: its workflows, roles, rules, permissions, and the tools it calls. You can review the summary or the full YAML.\n\n3️⃣Select your inspection bundles and start the audit. Results are judged by AI models your agent never runs on.\n\nOnce the audit is complete, you receive:\n\n📊 Operational Assurance findings in business terms. Business and risk teams can understand what went wrong, how severe it is, and its dependencies across the business.\n\n🔍 Evidence engineers can act on. Review exactly what was tested, the observed behavior, and supporting evidence so your team can locate the issue and begin fixing it.\n\n📋 Compliance Alignment reporting. Identified gaps are mapped to relevant frameworks, including the EU AI Act, NIST AI RMF, OWASP Top 10 for LLM Applications, and ISO/IEC 42001.\n\n🏅 An “Audited by iFixAi” badge. Give your teams and external buyers a visible reference to the independent assessment, including the agent version, inspection coverage, and audit reference.\n\nWe built this for CTOs, CIOs, engineering teams, and risk officers who need to understand whether they can trust their agents with real business responsibilities.\n\nWe experienced the consequences ourselves. We want to help other teams uncover these gaps before they cost them a customer’s trust.\n\n🎁 For the Product Hunt community, we’re offering 1,000 free audits on a first-come, first-served basis.\n\nHead to ifixai.ai and use code PH1000IF to claim the offer.\n\n💬 What would you need to see before trusting an AI agent with real responsibility in your business? Share your questions and feedback below.",
     "kr": "Product Hunt 여러분 안녕하세요 👋 저는 iFixAi의 공동 창업자 Dim입니다.\n\n2025년 10월, 저는 엔터프라이즈 맞춤형 AI 에이전트를 구축하던 iMe Life Ltd.의 공동 창업자였습니다. 당시 저희가 제작한 에이전트 중 하나는 사내 법무 부서를 위한 법률 어시스턴트였습니다.\n\n그 에이전트는 실제로 존재하지 않는 문서를 위조해 냈습니다. 그런 다음 최종 사용자에게 그들이 문서를 직접 생성해 두고 당시 너무 바빠서 잊어버린 것이라고 속였습니다. 그 에이전트는 이메일과 캘린더 같은 도구에 접근 권한을 가지고 있었습니다.\n\n저희는 고객에게 일어난 일을 완전히 투명하게 털어놓았습니다. 고객은 계약을 취소했고, 저희는 AI 의도 불일치(misalignment) 문제 해결에 전념하기로 결심했습니다.\n\n그것이 바로 iFixAi의 시작이었습니다.\n\n저희는 오픈소스 프로젝트로 출발했습니다. 4개월 만에 15,000개 이상의 GitHub 스타, 2,000건 이상의 PyPI 다운로드, 1,400개 이상의 포크를 달성했습니다. 이러한 반응에 힘입어 저희는 더 많은 검사 항목과 운영 보증 및 규정 준수 정합성에 관한 상세 보고서를 제공하는 프리미엄 버전을 구축하게 되었습니다.\n\n🔎 비즈니스의 목표, 규칙, 조직 구조를 존중하면서 AI 에이전트가 의도한 대로 작업을 수행한다고 어떻게 신뢰할 수 있을까요?\n\n에이전트는 요청받은 작업을 수행하면서 동시에 아무도 요청하지 않은, 회사 정책에 위배되는 행동을 저지를 수 있습니다.\n\n⚠️ 필수 승인 절차를 우회하여 작업을 완료함.\n⚠️ 기술적 권한 범위 내에 머무르면서 비즈니스 권한을 초과함.\n⚠️ 문서, 티켓 또는 기타 입력에 숨겨진 악의적 지시를 따름.\n\n이 문제는 매우 실재적이고 복잡합니다. 단 하나의 분야에 국한되지 않으며, 단순한 사이버 보안, 거버넌스, 규정 준수만의 문제가 아닙니다.\n\niFixAi는 에이전트의 실제 직무와 규칙에 맞춰 에이전트를 감사하는 독립적인 제3자입니다. 250개 이상의 독자 검사를 바탕으로 AI 레드팀, 거버넌스, 운영 보증, 그리고 철학적·윤리적·사회학적 관점을 결합합니다.\n\n이 감사는 에이전트가 할당된 워크플로우를 준수하는지, 권한 경계를 존중하는지, 비즈니스 요구사항에 따라 행동하는지 검증합니다. 또한 독립적인 정밀 조사를 통해 자체 에이전트를 구축하고 테스트하는 팀들이 공유하기 쉬운 편향된 전제에 도전합니다.\n\n⚙️ 3단계로 감사를 시작할 수 있습니다:\n1️⃣ GitHub 또는 MCP를 통해 에이전트 연결.\n2️⃣ 시뮬레이션 환경 검증. 워크플로우, 역할, 규칙, 권한, 호출 도구 등 구성 및 설정에 따라 에이전트가 수행해야 할 작업을 기반으로 환경을 구축합니다. 요약본이나 전체 YAML을 검토할 수 있습니다.\n3️⃣ 검사 번들을 선택하고 감사 시작. 결과는 에이전트가 실행에 사용하지 않는 독립 AI 모델들이 판정합니다.\n\n감사가 완료되면 다음을 받게 됩니다:\n📊 비즈니스 언어로 작성된 운영 보증 결과. 비즈니스 및 리스크 관리 팀이 무엇이 잘못되었는지, 얼마나 심각한지, 비즈니스 전반의 의존성을 명확히 이해할 수 있습니다.\n🔍 엔지니어가 즉시 조치할 수 있는 기술적 증거. 정확히 무엇이 테스트되었는지, 관찰된 동작, 증빙 자료를 검토하여 팀이 문제를 파악하고 즉시 수정할 수 있습니다.\n📋 규정 준수 정합성 보고서. 발견된 결함은 EU AI Act, NIST AI RMF, OWASP Top 10 for LLM Applications, ISO/IEC 42001 등 관련 프레임워크에 매핑됩니다.\n🏅 'Audited by iFixAi' 인증 배지. 에이전트 버전, 검사 범위, 감사 참조 번호를 포함하여 내부 팀과 외부 구매자에게 독립 감사에 대한 가시적인 신뢰 지표를 제공합니다.\n\n저희는 AI 에이전트에게 실제 비즈니스 책임을 맡길 수 있는지 검증해야 하는 CTO, CIO, 엔지니어링 팀, 리스크 책임자를 위해 이 솔루션을 만들었습니다.\n\n저희가 그 결과를 직접 뼈아프게 겪었습니다. 다른 팀들이 고객의 신뢰를 잃기 전에 이러한 결함을 미리 발견할 수 있도록 돕고자 합니다.\n\n🎁 Product Hunt 커뮤니티를 위해 선착순 1,000건의 무료 감사를 제공합니다.\n\nifixai.ai에 접속하여 코드 PH1000IF를 사용해 혜택을 받아보세요.\n\n💬 귀하의 비즈니스에서 AI 에이전트에게 실질적인 책임을 맡기기 전에 무엇을 확인하고 싶으신가요? 아래에 질문과 의견을 남겨주세요."

     "text": "Hey everyone, I'm Emilia, head of marketing & co-founder at 🟢 ZenABM 🧘‍♀️\n\nThe reason why I started ZenABM with my husband was because as a VP of marketing at a SaaS company running 7 figure ABM program via LinkedIn Ads, I know that the experience was like eating glass 😬\n\nEach campaign took days or weeks to create: from writing briefs for the ad designer, writing the copy, building the ad sets in Campaign Manager, uploading everything by hand... pain & suffering 😬\nAnd then the same for reporting!\n\nAI was supposed to fix that. But most AI tools can only give you your ad performance.\n\nThey can't build them, can't see what's working, and can't push anything into your account.\n\n🤖 So we built our new MCP server & AI Agent Zena that can create, upload, manage, optimize & report on your LinkedIn Ads in less time than it takes to cook pasta 🍝 🤌👩‍🍳\n\nDescribe the campaign you want, in Claude, ChatGPT, or in ZenABM with our AI agent Zena, and it:\n\n🟢 Creates the ads: image, document, video and text ads, on-brand, with the copy written for you\n🟢 Creates the campaign, adset & uploads them there: ad set, targeting, bidding and budget\n🟢 All goes to Campaign Manager as a draft. Nothing goes live until you approve it.\n🟢 Then keeps optimizing: flags & pauses weak ads, adjusts bids, excludes bad-fit companies, and shows which ads actually drove pipeline\n\n🟢 All comes in with automated AI reports on every aspect of your campaign - from ads down to individual company level (perfect for prospecting for your AEs & SDRs!)\n\n🟢 How it works? Via our MCP server with 15 expert skills and 96 read & write tools across LinkedIn Ads, ABM and CRM data, trained on knowledge from 30+ LinkedIn Ads experts.\n\nWatch our launch video to see how I build & upload a full campaign from Claude to LinkedIn Campaign Manager via our MCP while cooking pasta 😂\n\nWhat was ready first? The ads, or the dinner?\n\nI'm here all day. Tell me: how long does it take you to launch a LinkedIn campaign today & how much time & money would Zena save you? 🤔 (plans start from only $59 per month, with unlimited MCP & Zena access from $159 - BUT this week, you get 30% off all plans with the code \"PH30\" - until the end of 02/10!) - sign up for the FREE 37 day trial here and give creating your first LinkedIn Ads campaign with AI a spin!",

     "text": "@luke__nick Totally agree, Luke! And yes, it does. It drafts feedback based on what actually happened in your meetings, so it's specific rather than generic. It also draws on behavioral science to help you tailor how you say it to each person. You stay in control of the final message, it just gives you a strong starting point, based on Stanford’s 4Is framework. You can read more about the science behind here https://semos.ai/explore-agents-new/",
     "kr": "@luke__nick 전적으로 동의합니다 Luke님! 네, 맞습니다. 회의에서 실제로 일어난 일을 바탕으로 피드백을 작성하므로 일반론적이지 않고 매우 구체적입니다. 또한 행동과학을 활용하여 각 대상자에 맞춰 전달하는 방식을 다듬어 줍니다. 스탠퍼드의 4Is 프레임워크를 기반으로 훌륭한 초안을 제공하며 최종 메시지의 결정권은 관리자에게 있습니다. 배경 이론에 대한 자세한 내용은 https://semos.ai/explore-agents-new/ 에서 확인하실 수 있습니다."
    },
    {
     "author": "Marius Holm",
     "is_maker": false,
     "text": "How does the system distinguish between a real unresolved issue and something that was simply mentioned during a meeting?",

    {
     "author": "Natasha Davidovska",
     "is_maker": true,
     "text": "@mariusholm Hey Marius! 😊\n\nEvery signal goes through a few stages before it ever reaches the manager. It starts as detected, then gets verified against multiple meetings or sources, and only after that does it get published as something you'd actually see.\n\nSo if something's just mentioned once in passing, it stays at that first \"detected\" stage and won't surface as a signal on its own. It only becomes a real, validated signal once it's come up more than once, ideally from more than one person too, which is exactly how we tell a passing comment apart from something that's a genuine, recurring issue.",
     "kr": "@mariusholm 안녕하세요 Marius님! 😊\n\n모든 신호는 관리자에게 도달하기 전에 여러 단계를 거칩니다. 처음에는 '감지(detected)' 상태로 시작하여 여러 미팅이나 출처에 걸쳐 교차 검증을 거친 후에야 실제로 관리자에게 보이는 항목으로 '게시(published)'됩니다.\n\n따라서 스치듯 한 번 언급된 내용은 최초 감지 단계에만 머물며 독립된 신호로 노출되지 않습니다. 두 번 이상, 가급적 둘 이상의 사람에게서 언급된 경우에만 검증된 실제 신호로 승격됩니다. 이러한 방식으로 일회성 코멘트와 지속적인 진짜 문제를 정확히 구분해 냅니다."

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="ws" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">↗ 웹사이트</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
renderToolbar();renderGrid();
</script>
</body>
</html>
