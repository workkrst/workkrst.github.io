     "text": "Hey Product Hunt 👋 I’m Abhishek, founder of NitroStack.\n\nA while back I was on a project where we wanted AI to work with our own APIs and data. That’s when I came across MCP. I built my first tool, connected it to the model, and it worked surprisingly fast.\n\nThen I tried to ship it, and that’s where the real work started.\n\nBefore a single real user could touch it, I needed auth and permissions. When the model called the wrong tool, all I had were logs and guesswork. Then came deployment, scaling, monitoring. And after all that, I still had to build an app so people could actually use it.\n\nEvery step meant another tool to find and wire in. I was spending more time on plumbing than on the tools themselves.\n\nSo we built NitroStack: one project that goes from your first tool to production, without switching stacks.\n\n🧱 NitroStack SDK (TypeScript & Python, open source)\nDecorators, modules, dependency injection and guards, so if you’ve used NestJS it’ll feel familiar. Input validation is built in, and JWT, OAuth 2.1 and API key auth drop in with one import.\n\n🔍 NitroStack Studio\nRun any tool call, see what the model sent and why it picked that tool, and chat with your server the way a user would. It can also turn an existing API into MCP tools.\n\n🔗 NitroStack MCP Workflow\nConnect your MCP servers and chain them into automated workflows, so your tools stop being one-off calls and start working together as agents.\n\n☁️ NitroStack Cloud\nConnect your GitHub repo and push. It scales with traffic and down to zero when idle, with SSL and custom domains handled.\n\n💬 NitroStack Chat\nA white-labelled chat app on top of your server, so people can use what you built without you writing a frontend.\n\nIt’s still standard MCP underneath, so nothing is locked in. The same server works with ChatGPT, Claude, Cursor, or your own agents.\n\nSo far, developers have deployed 80000+ servers on NitroStack.\n\n🎁 For the Product Hunt community: sign up at nitrostack.ai today and get 1.5M free tokens, free deployments, and get featured in one of the largest MCP developer community in the world.\n\nIf you’re building with MCP, what are you still stitching together yourself? I’ll be in the comments all day 🙏",
     "kr": "안녕하세요 Product Hunt 여러분 👋 저는 NitroStack의 창업자 Abhishek입니다.\n\n얼마 전 자체 API 및 데이터와 AI를 연동하려는 프로젝트를 진행하던 중 MCP를 처음 접했습니다. 첫 번째 도구를 만들어 모델에 연결했더니 놀라울 정도로 빠르게 작동했습니다.\n\n하지만 이를 실제 프로덕션으로 배포하려던 순간부터 진짜 작업이 시작되었습니다.\n\n실제 사용자가 한 명이라도 쓰게 하려면 먼저 인증과 권한 관리가 필요했습니다. 모델이 잘못된 도구를 호출했을 때 가진 것이라곤 로그와 추측뿐이었습니다. 그다음에는 배포, 스케일링, 모니터링 문제가 이어졌고, 그 모든 과정을 거친 후에도 사람들이 실제로 사용할 수 있는 앱을 별도로 만들어야 했습니다.\n\n매 단계마다 새로운 도구를 찾아 연결해야 했고, 정작 도구 자체보다 배관(인프라) 작업에 더 많은 시간을 쏟고 있었습니다.\n\n그래서 저희는 스택을 바꿀 필요 없이 첫 번째 도구 개발부터 프로덕션 배포까지 하나의 프로젝트로 해결할 수 있는 NitroStack을 만들었습니다.\n\n🧱 NitroStack SDK (TypeScript & Python, 오픈소스)\n데코레이터, 모듈, 의존성 주입, 가드(guards)를 제공하여 NestJS를 사용해 보셨다면 익숙하게 느껴지실 겁니다. 입력 검증이 내장되어 있으며 JWT, OAuth 2.1, API 키 인증을 임포트 한 줄로 바로 적용할 수 있습니다.\n\n🔍 NitroStack Studio\n모든 도구 호출을 실행해 보고, 모델이 무엇을 보냈으며 왜 해당 도구를 선택했는지 확인하고, 실제 사용자처럼 서버와 대화해 볼 수 있습니다. 또한 기존 API를 MCP 도구로 변환할 수도 있습니다.\n\n🔗 NitroStack MCP Workflow\n여러 MCP 서버를 연결하여 자동화된 워크플로로 체이닝함으로써, 도구들이 단발성 호출에 그치지 않고 에이전트로서 함께 작동하게 만듭니다.\n\n☁️ NitroStack Cloud\nGitHub 저장소를 연결하고 푸시하기만 하면 됩니다. 트래픽에 따라 확장되고 유휴 상태일 때는 제로(0)로 축소되며, SSL과 커스텀 도메인도 자동으로 처리됩니다.\n\n💬 NitroStack Chat\n서버 위에 얹어지는 화이트라벨 채팅 앱으로, 별도의 프론트엔드 코드를 작성하지 않아도 사람들이 여러분이 만든 결과물을 바로 사용할 수 있습니다.\n\n내부적으로는 여전히 표준 MCP를 따르므로 종속(lock-in)될 걱정이 없습니다. 동일한 서버가 ChatGPT, Claude, Cursor 또는 자체 에이전트와 모두 호환됩니다.\n\n지금까지 개발자들이 NitroStack에 80,000개 이상의 서버를 배포했습니다.\n\n🎁 Product Hunt 커뮤니티를 위한 혜택: 오늘 nitrostack.ai에서 가입하시면 150만 무료 토큰과 무료 배포 혜택을 드리며, 세계 최대 규모의 MCP 개발자 커뮤니티에 소개될 기회를 제공해 드립니다.\n\n현재 MCP로 개발 중이시라면 어떤 부분들을 여전히 직접 엮어서 구축하고 계신가요? 하루 종일 댓글에서 답변드리겠습니다 🙏"

     "is_maker": true,
     "text": "Hi Product Hunt! I'm Mike. I keep almost everything in Obsidian, about 4,000 notes, and two things bugged me. My notes never turned into anything other people could see. And the public \"digital gardens\" people do build are islands: you can't link from your garden into a friend's. Caldera fixes both. It reads your vault on your device and publishes a living profile (daily journal, activity, timeline, projects) that refreshes itself every few hours. With 0.5 you can plant notes in a Garden folder and each one becomes a page, and [[@handle/Note]] links connect gardens with backlinks on both sides. Every note is hashed into a signed manifest, so authorship travels with it. It's free and open source (MIT plugin, AGPL hub), and setup is one prompt you paste into Claude Code, Codex or Cursor. I'd love feedback on two things: what would make you plant notes in public, and what you'd want a link between two gardens to do.",
     "kr": "안녕하세요 Product Hunt 여러분! 저는 Mike입니다. 저는 약 4,000개의 노트를 포함해 거의 모든 것을 Obsidian에 보관하고 있는데, 늘 두 가지가 아쉬웠습니다. 제 노트가 다른 사람들이 볼 수 있는 무언가로 이어지지 않는다는 점과, 사람들이 만드는 공개 '디지털 가든'이 각자 고립된 섬 같아서 내 가든에서 친구의 가든으로 링크를 걸 수 없다는 점이었습니다. Caldera는 이 두 가지 문제를 모두 해결합니다. 기기에서 사용자의 볼트를 읽어 몇 시간마다 스스로 새로고침되는 살아있는 프로필(일일 저널, 활동, 타임라인, 프로젝트)을 발행합니다. 0.5 버전에서는 Garden 폴더에 노트를 심으면 각 노트가 하나의 웹페이지가 되며, [[@handle/Note]] 링크를 통해 양쪽 모두에 백링크가 생성되면서 서로의 가든을 연결해 줍니다. 모든 노트는 서명된 매니페스트에 해시로 기록되므로 원작자 증명이 노트를 따라다닙니다. 무료 오픈소스(MIT 플러그인, AGPL 허브)이며, Claude Code, Codex 또는 Cursor에 프롬프트 하나만 붙여넣으면 설치가 끝납니다. 두 가지에 대한 피드백을 듣고 싶습니다. 어떤 점이 여러분으로 하여금 노트를 공개적으로 심게 만들까요? 그리고 두 가든 사이의 링크가 어떤 역할을 하길 원하시나요?"

   "comment_summary": "댓글에서는 정신건강의학과 의사인 Cynthia Lam과 공동창업자 Mawuli Adjei, 디자이너 Vanessa Tam이 정서 과학 논문 근거와 비대칭 형태로 변하는 Mochi 캐릭터의 디자인 철학을 공유했습니다. 사용자들은 앱이 잘못된 감정을 선택했을 때 수정할 수 있는지와 과거 기록을 돌아보며 시간 경과에 따른 감정 변화를 확인할 수 있는지에 대해 질문했습니다. 메이커 팀은 학술 연구에 따라 단일 감정이 아닌 복합적인 모든 감정을 함께 표시하므로 별도 수정이 필요 없으며, 캘린더 뷰·주제별 스레드(Threads)·월간 맞춤 리포트 및 25개 기록 달성 시 해금되는 심층 트렌드 분석을 통해 장기적인 감정 변화를 입체적으로 추적할 수 있다고 답변했습니다.",

     "kr": "안녕하세요 Product Hunt 여러분! 👋🏻\n\n여러분의 생각과 감정을 살아있는 'Mochi' 캐릭터로 바꿔주는 음성 저널, Emochi를 소개하게 되어 기쁩니다.\n\nCynthia, Mawuli, 그리고 팀을 위해 이 제품을 헌팅했습니다. 자기 성찰을 친근하고 창의적인 경험으로 만들어준다는 점이 정말 마음에 듭니다.\n\n아래에서 Cynthia가 직접 개발 비하인드 스토리를 들려드릴 예정입니다!"

     "author": "Cynthia Lam",
     "is_maker": true,
     "text": "@nzieber thank you Nick!\n\nI'm Cynthia, a doctor and researcher in psychiatry. With my co-founders Mawuli, Vanessa, and James, I built Emochi, a voice journal grounded in affective science.\n\nAs a doctor, I've always recommended journaling. Expressing our feelings helps us make sense of them (Pennebaker & Beall, 1986), and talking may work at least as well as writing (Esterling et al., 1994). But after a long shift, a blank page felt exhausting, and a 1–10 mood scale felt shallow.\n\nEmochi is built on three ideas from research:\n\n1️⃣ Naming emotions calms the noise. Putting feelings into words is linked to a calmer brain and body response (Lieberman et al., 2007).\n\n2️⃣ Specifics help. People who can tell their emotions apart tend to regulate them more readily (Barrett et al., 2001).\n\n3️⃣ Noticing matters. Regular mood check-ins boosted self-awareness in young people (Kauer et al., 2012). Emochi turns your entries into shapes so you can see your patterns.\n\nNon-clinical, private, and judgment-free. Emochi supports your personal growth.\n\nWe'll be here all day reading your feedback! 💙",
     "kr": "@nzieber 고마워요 Nick!\n\n저는 정신건강의학과 의사이자 연구자인 Cynthia입니다. 공동창업자인 Mawuli, Vanessa, James와 함께 정서 과학(affective science)에 기반한 음성 저널 Emochi를 만들었습니다.\n\n의사로서 저는 늘 일기 쓰기를 권장해 왔습니다. 감정을 표현하는 것은 감정을 이해하는 데 도움이 되며(Pennebaker & Beall, 1986), 말로 풀어내는 것은 최소한 글쓰기만큼이나 효과적일 수 있습니다(Esterling et al., 1994). 하지만 긴 근무를 마친 뒤 빈 종이를 마주하는 것은 피로하게 느껴졌고, 1~10점 척도로 기분을 매기는 것은 너무 얕게 느껴졌습니다.\n\nEmochi는 연구에서 검증된 세 가지 아이디어를 바탕으로 구축되었습니다:\n\n1️⃣ 감정에 이름을 붙이면 내면의 소음이 가라앉습니다. 감정을 단어로 표현하는 것은 뇌와 신체의 반응을 더 차분하게 만드는 것과 연결됩니다(Lieberman et al., 2007).\n\n2️⃣ 구체적일수록 도움이 됩니다. 자신의 감정을 세밀하게 구분할 수 있는 사람일수록 감정을 더 잘 조절하는 경향이 있습니다(Barrett et al., 2001).\n\n3️⃣ 알아차림이 중요합니다. 정기적인 기분 체크인은 젊은 층의 자기 인식을 높여주었습니다(Kauer et al., 2012). Emochi는 여러분의 기록을 시각적인 형태로 바꾸어 감정 패턴을 직접 눈으로 확인할 수 있게 해줍니다.\n\n비임상적이고 사적이며 어떠한 판단도 없는 공간, Emochi가 여러분의 내면적 성장을 응원합니다.\n\n하루 종일 이곳에서 여러분의 피드백을 읽고 소통하겠습니다! 💙"

     "text": "A bit of a personal anecdote. The last few months, while building Emochi, have been some of the toughest from an emotional perspective. It was our hunch at the beginning that it’s important to journal as an outlet and way to recognise patterns. My use of Emochi confirmed this without a doubt. Every heavy journalling session was easier to manage because with Emochi, I could name my feelings with granularity. And I could see them in a third person and accept or distance myself from negative emotions. The biggest difference was on those days where my journals leaned negative. Seeing that made me consider leaning a little more positive in my next entries, towards hope and gratitude. And the periodic reports helped me tease the patterns going on that I couldn’t piece together before. There are many journalling apps out there, but we still feel strongly there’s still space to help more people. We tried to make it easy to use, and our artist poured a LOT of visual taste and beauty into Emochi. I’m sure you’d enjoy it. Let us know what you think!",

   "desc_kr": "Train with Pasta는 Apple Intelligence를 활용해 주머니 속 퍼스널 트레이너 역할을 해주는 iOS 전용 운동 코칭 앱입니다. 사용자가 \"30분 상체 운동\"처럼 원하는 운동을 요청하면 맞춤형 루틴을 즉시 생성해 주며, 운동 목표와 운동 가능한 요일을 알려주면 그에 맞춘 장기 훈련 플랜도 작성해 줍니다. 운동 중에는 실시간 음성 가이드를 제공하여 사용자가 화면을 계속 볼 필요 없이 운동 수행에만 온전히 집중할 수 있도록 돕습니다. 건강과 운동 결과를 억지로 점수화하는 게이미피케이션(Gamification)을 배제하고, 실제 전문 퍼스널 트레이너의 코칭에 가까운 실질적인 운동 설계와 동기부여를 지향합니다. 별도의 계정 생성이 필요 없으며, 모든 운동 진행 상황과 건강 데이터가 외부 서버로 전송되지 않고 기기 내부(On-device)에만 안전하게 보관됩니다.",
   "launch_url_used": "https://www.producthunt.com/products/train-with-pasta",
   "comment_summary": "메이커인 Tim Shim은 10년 전 성우를 고용해 만들었던 미출시 운동 앱의 경험을 바탕으로 오늘날 발전된 음성 모델과 Apple Intelligence를 활용해 이 앱을 개발하게 된 배경을 공유했습니다. 아울러 현재 루틴 생성 및 플래닝 품질을 사용자 피드백과 평가(Evals)를 통해 공인 퍼스널 트레이너 수준으로 개선해 나가고 있으며, 건강 결과를 단순 포인트 게임처럼 게이미피케이션하지 않겠다고 강조했습니다. 댓글 작성자들은 플래닝의 한계를 솔직하게 밝힌 점과 점수 경쟁 방식을 배제한 점에 공감하며, Apple Intelligence를 통해 모든 운동 데이터와 조언이 외부 서버가 아닌 기기 내부에만 머문다는 점을 높이 평가했습니다.",

     "author": "Tim Shim",
     "is_maker": true,
     "text": "Hi Product Hunt! I'm Tim, and I made y'all some Pasta. :)\n\nOthers have New Year's resolutions to get fit, mine's to build an app in hopes of getting fit.\n\nFun fact, I did build something like this over 10 years ago but I never released it. Co-founder issues if you must know. I called it Träna Fit, träna being the Swedish word for train. I remember hiring a voice actor on Fiverr to speak rep counts. She had such a sultry voice, which made the app/workout experience quite interesting.\n\nFast forward to today and voice models are good enough to do much of this, and more. It's one out of many things I've always wanted to have during my workouts. When it comes to planning and generation, I have to admit that it does still have plenty of room for improvement. I'm hoping to make the evals better as I get more feedback on what's working and what's not. Over time, I'd like for it to come as close as possible to what a certified personal trainer would build for you based on your goals and needs.\n\nI also realize that getting fit and working out isn't solely about knowing what to do. There's also the motivation + accountability part, and I do have some ideas on the roadmap that I'll share later. And I swear, it's not gamifying your health and fitness results.\n\nGive the app a try. I'd love to know what you ask it for first, and whether you'd do the workout it builds. I'll be here all day answering questions - though it is my mum's birthday today and I'll be out for dinner in the evening but will keep an eye on here occasionally.",
     "kr": "안녕하세요 Product Hunt 여러분! 저는 Tim이고, 여러분을 위해 파스타(Pasta)를 좀 만들어 왔습니다. :)\n\n다른 사람들은 건강해지겠다는 새해 다짐을 하지만, 저는 건강해지기를 바라며 앱을 만들겠다는 다짐을 했습니다.\n\n재미있는 사실은 제가 10여 년 전에도 이와 비슷한 앱을 만들었지만 끝내 출시하지 못했다는 점입니다. 굳이 이유를 밝히자면 공동창업자 문제 때문이었죠. 당시 앱 이름은 스웨덴어로 '훈련하다(train)'라는 뜻의 단어를 따서 Träna Fit이라고 지었습니다. 반복 횟수(rep counts)를 읽어줄 성우를 Fiverr에서 고용했던 기억이 나는데, 목소리가 워낙 매혹적이어서 운동 경험이 사뭇 묘해졌던 기억이 납니다.\n\n시간이 흘러 오늘날에는 음성 모델이 이 모든 것, 나아가 그 이상을 해낼 만큼 충분히 발전했습니다. 운동할 때 제가 늘 갖고 싶었던 여러 기능 중 하나입니다. 운동 계획 수립 및 루틴 생성 측면에서는 아직 개선의 여지가 많다는 점을 솔직히 인정합니다. 어떤 부분이 잘 작동하고 어떤 부분이 부족한지 피드백을 받으면서 평가(evals)를 계속 개선해 나갈 계획입니다. 시간이 지나면서 사용자의 목표와 필요에 맞춰 공인 퍼스널 트레이너가 짜주는 프로그램에 최대한 가까워지도록 만들고 싶습니다.\n\n또한 건강해지고 운동을 지속하는 것이 단순히 무엇을 해야 하는지 아는 것만으로 해결되지 않는다는 점도 잘 알고 있습니다. 동기부여와 책임감(accountability)이라는 요소도 중요하기에, 이와 관련해 로드맵에 구상해 둔 아이디어들을 추후 공유할 예정입니다. 그리고 맹세코 건강과 피트니스 결과를 억지로 게임화(gamifying)하는 방식은 아닙니다.\n\n앱을 한번 사용해 보세요. 가장 먼저 어떤 운동을 요청하셨는지, 그리고 앱이 만들어준 루틴을 실제로 수행해 보실 의향이 있는지 궁금합니다. 오늘 하루 종일 이곳에서 질문에 답변드리겠습니다. 다만 오늘이 어머니 생신이라 저녁에는 식사하러 외출하겠지만 종종 확인하도록 하겠습니다."

const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="lnk" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="lnk" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">💬 PH에서 보기</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
(function(){
 const dq=DATA.disquiet;
 if(!dq||!dq.length)return;
 const sec=$('#dqsec');
 const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const hr=document.createElement('hr');
 hr.className='dq-divider';
 sec.appendChild(hr);
 const head=document.createElement('div');
 head.className='dq-header';
 head.innerHTML=`<h2>🇰🇷 디스콰이엇 신규 프로덕트 ${dq.length}건</h2><div class="dq-sub">disquiet.io 신규 등록 · 한줄 코멘트는 AI 요약</div>`;
 sec.appendChild(head);
 const g=document.createElement('div');
 g.className='grid';
 dq.forEach(p=>{
  const c=document.createElement('div');
  c.className='card dq-card';
  const cmtHtml=p.comment?`<div class="dq-cmt">💡 ${esc(p.comment)}</div>`:'';
  c.innerHTML=`<div class="dq-head"><div class="dq-name">${esc(p.name)}</div><div class="up">▲ ${p.upvotes!=null?p.upvotes:0}</div></div>`+
   `<div class="dq-tag">${esc(p.tagline)}</div>`+
   cmtHtml+
   `<div class="dq-foot"><a class="lnk dq-lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">💬 디스콰이엇에서 보기</a></div>`;
  c.onclick=()=>{if(p.url)window.open(p.url,'_blank','noopener,noreferrer')};
  g.appendChild(c);
 });
 sec.appendChild(g);
})();
renderToolbar();renderGrid();
</script>
