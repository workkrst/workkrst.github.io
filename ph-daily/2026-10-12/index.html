*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:60px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}

.card img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--chip)}

.up{color:var(--acc);font-weight:800;font-size:14px;white-space:nowrap}

a{color:var(--acc)}

.foot .lnk{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--acc);text-decoration:none;margin-left:6px;white-space:nowrap}

     "text": "Hey Product Hunt! 👋  \n  \nI’m Nela, co-founder of HireKey  \n  \nI spent 10 years recruiting for technical and non-technical roles at Microsoft, Amazon, and Stripe, to name a few. I reviewed thousands of resumes and interviewed thousands of candidates.  \n  \nTime and time again, I saw qualified people get passed over simply because their resumes didn’t connect their experience to the role, or because they struggled to explain that experience in an interview. They had the right skills, but hiring managers weren’t seeing the connection.  \n  \nThat stayed with me because many of those people were incredibly talented, genuine people whom I had to give the unfortunate news of rejection, which is honestly the worst part of recruiting.  \n  \nSo, we built HireKey around the recruiting knowledge I’d gathered over those 10 years, giving job seekers access to the perspective from the other side of the hiring table.  \n  \nHireKey helps you assess how your experience fits a role, tailor your resume, practice interviews with an interactive AI voice coach, and track your applications in one place.  \n  \n**How it works**  \n  \n**1. Add the job and your master resume.** Find a role you want to apply for and add its title, company, location, and job description to HireKey’s Job Tracker. Upload your master resume once, then use it across the jobs you’re considering.  \n  \n**2. Tailor your resume and assess your fit.** HireKey adapts your master resume to the job description, bringing your relevant experience into focus, along with an analysis of missing skills or experience and whether transferable experience could help bridge those gaps.  \n  \n**3. Practice out loud, on demand.** Practice using the STAR framework with an interactive AI voice coach. Get specific feedback on where your answers are strongest and where you still need practice.  \n  \n**4. Keep your search organized.** Track applications through stages such as applied, screening, and interviewing, so you always know where things stand.  \n  \n**Coming soon: Chrome extension for auto job capture**  \nPremium users will be able to use a chrome extension that will automatically capture job details and enter them into HireKey's job tracker  \n  \n**A closer look at interview practice**  \n  \nKnowing your work and explaining it clearly are two different skills. This was something I saw repeatedly as a recruiter, and it’s why interview practice is such an important part of HireKey.  \n  \nYou can choose practice questions or add your own, then start speaking with the coach, all on demand. It responds to what you actually say and helps you identify where an answer needs more clarity or detail. You also get a debrief on what went well and what to improve.  \n  \nPrefer to prepare on your own first? You can print interview questions with tips on how to approach your answers.  \n  \n**Who it’s for**  \n  \nHireKey is built for people pursuing technical and non-technical roles in tech, especially when you:  \n  \n- Find an interesting role but aren’t sure how well your experience fits.  \n- Need help making your relevant experience clear on your resume.  \n- Know your work but struggle to explain it in an interview.  \n- Have multiple applications in progress and need to keep track of them.  \n  \n**Get 1 month of Premium free with our** Product Hunt launch offer.  \n  \nWe’d love to hear from you: What’s hardest about job searching? Is it deciding where to apply, showing your experience on paper, or talking about it in an interview?",
     "kr": "Product Hunt 여러분 안녕하세요! 👋\n\nHireKey의 공동창업자 Nela입니다.\n\n저는 마이크로소프트, 아마존, 스트라이프 등에서 지난 10년 동안 기술직과 비기술직 채용을 담당했습니다. 수천 장의 이력서를 검토하고 수천 명의 지원자를 인터뷰했죠.\n\n그 과정에서 역량을 충분히 갖추었음에도 불구하고 이력서에 자신의 경험이 직무와 어떻게 연결되는지 명확히 드러나지 않거나, 인터뷰에서 그 경험을 제대로 설명하지 못해 탈락하는 지원자들을 수없이 목격했습니다. 적절한 능력을 가졌음에도 채용 담당자가 그 연관성을 보지 못한 것입니다.\n\n정말 유능하고 진실된 분들에게 불합격 소식을 전해야 할 때마다 마음에 깊이 남았고, 이는 채용 담당자로서 가장 힘든 순간이었습니다.\n\n그래서 저희는 지난 10년간 쌓아온 채용 지식을 기반으로, 구직자들에게 채용 담당자 시선의 인사이트를 제공하고자 HireKey를 만들었습니다.\n\nHireKey는 지원자의 경험이 직무와 얼마나 부합하는지 평가하고, 이력서를 맞춤 수정하며, 인터랙티브 AI 음성 코치와 면접을 연습하고, 모든 지원 현황을 한곳에서 추적할 수 있도록 돕습니다.\n\n**작동 방식**\n\n**1. 채용 공고와 마스터 이력서 등록:** 지원하려는 직무를 찾아 직무명, 회사, 위치, 직무 기술서를 HireKey의 구직 트래커에 추가합니다. 마스터 이력서를 한 번만 업로드하면 고려 중인 여러 공고에 바로 활용할 수 있습니다.\n\n**2. 맞춤 이력서 작성 및 적합도 평가:** HireKey가 마스터 이력서를 직무 기술서에 맞춰 조정하여 관련 경험을 부각하고, 부족한 기술이나 경험을 분석하며 전이 가능한 기술로 공백을 메울 수 있는지 검토합니다.\n\n**3. 언제든 소리 내어 실전 연습:** 인터랙티브 AI 음성 코치와 함께 STAR 프레임워크를 기반으로 연습합니다. 답변 중 어떤 부분이 강력하고 어디를 더 보완해야 하는지 구체적인 피드백을 받습니다.\n\n**4. 체계적인 구직 관리:** 지원 완료, 서류 전형, 면접 등 전형 단계별로 지원 현황을 추적하여 언제나 진행 상황을 한눈에 파악합니다.\n\n**출시 예정: 채용 공고 자동 수집 크롬 확장 프로그램**\n프리미엄 사용자는 공고 내용을 일일이 입력할 필요 없이 자동으로 HireKey 구직 트래커에 캡처해 주는 크롬 확장 프로그램을 곧 이용할 수 있습니다.\n\n**면접 연습 기능 자세히 보기**\n\n자신의 업무를 아는 것과 이를 명확히 설명하는 것은 완전히 다른 역량입니다. 채용 담당자 시절 반복해서 목격했던 문제였기에 면접 연습을 HireKey의 핵심 기능으로 구축했습니다.\n\n추천 질문을 선택하거나 직접 질문을 추가한 후 즉시 코치와 대화를 시작할 수 있습니다. 사용자의 실제 답변을 듣고 반응하며, 어디에 더 명확한 설명이나 세부 정보가 필요한지 짚어줍니다. 연습이 끝나면 잘된 점과 개선할 점에 대한 종합 피드백 보고서를 제공합니다.\n\n먼저 혼자 준비하고 싶으신가요? 답변 접근 팁이 포함된 면접 질문을 인쇄해 볼 수도 있습니다.\n\n**추천 대상**\n\nHireKey는 테크 분야의 기술직 및 비기술직 구직자를 위해 만들어졌으며, 특히 다음과 같은 분들에게 적합합니다:\n\n- 관심 있는 공고를 찾았지만 내 경험이 얼마나 부합하는지 확신이 서지 않을 때\n- 내 관련 경험을 이력서에 명확히 드러내는 데 도움이 필요할 때\n- 내 업무는 잘 알지만 면접에서 조리 있게 설명하기 어려울 때\n- 여러 군데 지원 중이라 지원 현황을 체계적으로 관리해야 할 때\n\n**Product Hunt 런칭 혜택으로 프리미엄 1개월 무료 혜택을 받아보세요.**\n\n여러분의 의견을 듣고 싶습니다. 구직 과정에서 가장 어려운 부분은 무엇인가요? 지원할 곳을 결정하는 것인가요, 서류에 경험을 드러내는 것인가요, 아니면 인터뷰에서 이를 말로 풀어내는 것인가요?"
    },
    {
     "author": "Enio Aguiar",
     "is_maker": false,
     "text": "I'm a junior backend dev in Brazil applying for remote roles, both local and international. Two questions: does the recruiter input carry over to hiring outside big US tech, and does the voice coach give feedback to non-native English speakers, or only on the content of the answer?",
     "kr": "저는 브라질의 주니어 백엔드 개발자이며 국내외 원격 근무 포지션에 지원하고 있습니다. 두 가지 질문이 있습니다. 미국 빅테크 외의 해외 채용에도 채용 담당자의 조언이 그대로 유효한가요? 그리고 음성 코치가 비원어민 영어 사용자에게도 피드백을 제공하나요, 아니면 순수하게 답변 내용에만 집중하나요?"
    },
    {
     "author": "Nela Davis",
     "is_maker": true,
     "text": "@wwenioaguiar thank you, and great questions. Our recruiter perspective comes from US tech, but HireKey looks at the requirements of the specific role you’re applying to. Showing relevant backend work and being clear about what you personally built can help across markets. We haven’t validated every recommendation against Brazilian hiring practices, so I wouldn’t claim the guidance is universal. For English interview practice, you can answer the voice coach out loud. It gives feedback on the content and structure of your answer, including how clearly you explain your actions and results. It doesn’t grade your accent, pronunciation, or fluency, and speech recognition can sometimes mishear words. You can also type your answer. Are you applying to roles with English interviews, Portuguese interviews, or both? This can help us prioritize language features.",
     "kr": "@wwenioaguiar 질문 감사합니다, 좋은 질문이네요. 저희의 채용 관점은 미국 테크 업계에 기반을 두고 있지만, HireKey는 지원자가 지원하는 개별 직무의 구체적 요구사항을 분석합니다. 관련된 백엔드 업무 경험을 보여주고 본인이 직접 구축한 내용을 명확히 설명하는 것은 어느 시장에서나 큰 도움이 됩니다. 다만 브라질 현지 채용 관행에 맞춰 모든 추천을 검증한 것은 아니므로 가이드가 보편적이라고 단언하지는 않겠습니다. 영어 면접 연습의 경우 음성 코치에게 소리 내어 답변하시면 됩니다. 행동과 결과를 얼마나 명확하게 설명했는지를 포함하여 답변의 내용과 구조에 대해 피드백을 제공합니다. 억양, 발음, 유창성을 채점하지는 않으며, 음성 인식이 때때로 단어를 잘못 알아들을 수도 있습니다. 원하시면 텍스트로 타이핑하여 답변할 수도 있습니다. 현재 영어 인터뷰, 포르투갈어 인터뷰 중 어느 쪽을 준비하고 계신가요? 언어 지원 기능의 우선순위를 정하는 데 참고하고자 합니다."
    },
    {
     "author": "Enio Aguiar",
     "is_maker": false,
     "text": "@founder92 Thanks for the straight answer, the \"not universal\" part is useful to know. So far all my applications have been in Portuguese, for Brazilian companies. The international roles I want to try next interview in English, and that's where a voice coach would help. Feedback on how clearly I explain what I built is the part I need most: my projects are solo, and it's easy to either undersell them or explain every detail. If you add pronunciation feedback later, non-native speakers would be a big group to test it with.",
     "kr": "@founder92 솔직한 답변 감사합니다. '보편적이지는 않다'는 점을 미리 알 수 있어 유용하네요. 지금까지 제 지원은 모두 브라질 기업 대상이라 포르투갈어로 진행되었습니다. 다음으로 도전하려는 해외 포지션은 영어로 인터뷰를 보는데, 바로 이 부분에서 음성 코치가 큰 도움이 될 것 같습니다. 제가 구축한 것을 얼마나 명확하게 설명하는지에 대한 피드백이 가장 필요합니다. 솔로 프로젝트이다 보니 과소평가하여 말하거나 반대로 불필요한 모든 세부 사항까지 장황하게 늘어놓기 쉽거든요. 나중에 발음 피드백 기능이 추가된다면 비원어민 사용자들이 훌륭한 테스트 그룹이 될 것입니다."
    },
    {
     "author": "Nela Davis",
     "is_maker": true,
     "text": "@wwenioaguiar that balance between underselling a solo project and explaining every detail is exactly what I’d want the coach to help with. If you try an English practice question, I’d love to hear where the feedback helps and where it falls short. I’d also be happy to spend 15–20 minutes talking through one of your project answers and sharing my recruiter perspective. Your experience would help us improve HireKey too. If you’re interested, email me at hello@hirekey.io. And thank you for the thoughtful offer to help test pronunciation feedback if we build it.",
     "kr": "@wwenioaguiar 솔로 프로젝트를 과소평가하는 것과 모든 세부 사항을 다 설명하는 것 사이의 균형을 맞추는 것이야말로 음성 코치가 돕고자 하는 핵심 부분입니다. 영어 연습 질문을 체험해 보신다면 피드백이 어떤 부분에서 유용했고 어디가 부족했는지 꼭 듣고 싶습니다. 또한 괜찮으시다면 15~20분 정도 시간을 내어 지원자님의 프로젝트 답변 하나를 함께 검토하고 리크루터의 시각을 공유해 드릴 수도 있습니다. 전해주시는 경험은 HireKey를 개선하는 데도 큰 도움이 될 것입니다. 관심 있으시면 hello@hirekey.io 로 이메일 주세요. 발음 피드백 개발 시 테스트를 도와주겠다는 따뜻한 제안에도 감사드립니다."
    },
    {
     "author": "Khaild Naseem",
     "is_maker": false,
     "text": "Does the voice coach evaluate answer structure as well as technical accuracy?",
     "kr": "음성 코치가 기술적 정확성뿐만 아니라 답변의 구조도 평가해 주나요?"
    },
    {
     "author": "Nela Davis",
     "is_maker": true,
     "text": "@khaildnaseem Yes on structure. The coach helps you work through an answer using STAR and points out where you could add clarity or detail. I wouldn’t treat it as a definitive check of technical accuracy, though.\nHowever, if we get enough interest or feature requests for technical interviews with accuracy evaluation criteria, we are open to exploring and building.",
     "kr": "@khaildnaseem 구조 측면에서는 그렇습니다. 코치는 STAR 기법을 활용해 답변을 정리하도록 돕고 어디에 명확성이나 세부 내용을 추가해야 할지 짚어줍니다. 다만 이를 기술적 정확성에 대한 확정적인 검증으로 받아들이지는 않으셨으면 합니다.\n하지만 정확도 평가 기준이 포함된 기술 면접에 대한 관심이나 기능 요청이 충분히 많다면 적극적으로 검토하고 개발할 의향이 있습니다."
    },
    {
     "author": "Gal Dayan",
     "is_maker": false,
     "text": "the honest answer about not checking technical accuracy is the part I'd watch out for as a user. STAR structure feedback could make someone sound more confident delivering an answer that's actually wrong, and a polished delivery of a wrong answer is worse in a real interview than a rough delivery of a right one. is there any plan to at least flag when an answer sounds complete but is thin on verifiable specifics, even without full technical grading?",
     "kr": "기술적 정확도를 검증하지 않는다는 솔직한 답변은 사용자로서 주의 깊게 봐야 할 부분입니다. STAR 구조 피드백은 실제로 틀린 답변을 말하면서도 더 자신감 있게 들리게 만들 수 있는데, 실제 면접에서는 정답을 거칠게 전달하는 것보다 오답을 유창하게 말하는 것이 훨씬 위험하니까요. 완전한 기술 채점은 아니더라도, 답변이 겉보기엔 그럴듯하지만 검증 가능한 구체적 근거가 부족할 때 이를 최소한 플래그로 표시해 주는 기능에 대한 계획이 있나요?"
    },
    {
     "author": "Nela Davis",
     "is_maker": true,
     "text": "@galdayan a polished answer shouldn’t get a pass if it’s thin on evidence. The coach is designed to probe for what you personally did, why you made certain decisions, and what happened as a result. The debrief (feedback after your interview practice) marks down vague answers even when they sound complete. That’s a check on the evidence in the answer, not a verification that every technical claim is correct. Your suggestion to make that distinction more explicit in the feedback is a good one. We’ll test how clearly the current coach flags it.",
     "kr": "@galdayan 근거가 부족하다면 유창한 답변이라도 좋은 평가를 받아서는 안 됩니다. 음성 코치는 지원자가 개인적으로 수행한 역할, 특정 결정을 내린 이유, 그리고 그에 따른 결과를 구체적으로 파고들도록 설계되어 있습니다. 인터뷰 연습 후 제공되는 디브리프(피드백)에서는 겉보기에 완벽해 보이더라도 모호한 답변에 대해서는 점수를 낮게 책정합니다. 이는 모든 기술적 주장이 사실인지 검증하는 것이 아니라 답변 속 증거의 구체성을 검토하는 것입니다. 피드백에서 이러한 차이를 더 명확히 드러내라는 제안은 매우 유익합니다. 현재 코치가 이를 얼마나 명확하게 표시하는지 테스트해 보겠습니다."
    },
    {
     "author": "Gal Dayan",

     "is_maker": true,
     "text": "Hey Product Hunt 👋 Andriana here, co-founder of kōdlo🐍  \n  \n**The Problem.** Selling a complex product takes hours of prep. You jump between a few disconnected tools to research accounts, draft personalized outreach, and assemble pitch decks. Context gets lost, and you end up spending more time on prep than talking to buyers.  \n  \n**The Solution.** kōdlo is an end-to-end sales workspace that keeps the context for you. Find prospects, research them, and write messages, proposals and decks in one place. Everything you do there, from research and notes to your documents and past conversations, stays in kōdlo's memory, so each new piece of work builds on what it already knows.  \n  \n**What makes it different?** kōdlo is built on one shared memory that every agent can use. The agent also sees what you see. Chat sits on the left, your work on the right. On top of that sits everything you need to sell: prospecting, research, your own knowledge base, outreach, decks, a task tracker, team collaboration and scheduled work.  \n  \nKey features:  \n**🎯 Find prospects with a reason.** Describe who you sell to and kōdlo finds matching companies and decision makers. Each one comes with evidence for why it fits, like a funding round, a job ad or a line on their website.  \n**🔍 Deep search**. Research on any company, market or person, written up as a report where every claim links to its source.  \n**📚 Knowledge Hub.** Upload price lists, case studies, tech docs, even scanned PDFs. kōdlo answers from your own documents and cites the file and page it used.  \n**✍️ Writes in your voice.** LinkedIn messages, connection notes and proposals in a tone of voice you set once. You send them yourself.  \n**📊 Decks in your brand.** kōdlo builds a template from your PowerPoint and exports to PPTX or PDF.  \n**⏰ Work that keeps going**. Put tasks on a schedule or hand kōdlo a list of up to 5,000 rows to work through.  \n🔌 **Your context in your AI tools.** Connect kōdlo over MCP and use the same prospects, plans, documents and decks in Claude Desktop, Claude Code, Codex, OpenAI Work and Dots, or any other tool that supports MCP.  \n  \nWho is it for? Founders and small teams selling B2B SaaS, sales people in IT services companies, and anyone selling a technical product where the know-how sits with the engineers.  \n  \n🎬 Interactive demo →  \n🎁 PH offer → The first 100 sign-ups get 10% off the Starter plan.  \n  \nHuge thanks to our core team, Ivan, Jakub and Vitalii, and to Rohan for hunting us!  \nWe’re here for honest feedback and our first users. Tell us what works, what feels confusing, and what’s missing — we’re ready for critiques. Every comment gets read, and the best ideas go straight onto our roadmap.",

     "author": "Etienne Lescot",
     "is_maker": true,
     "text": "Hi Product Hunt, I'm Etienne and I maintain OpenScreen.  \n  \nIt started as Siddharth Vaddem's side project, a free alternative to Screen Studio. He archived it in June and I took it over with his approval. 2.0 is four months of work since then, and 137 people have contributed to the project so far.  \n  \nWhat's new:  \n*   a local MCP server, so Claude Code or another agent can do the edit for you  \n*   zooms planned from your clicks, as shots, not one per click  \n*   cut the video by deleting words in the transcript, captions transcribed locally  \n*   webcam beside or above the recording, with background blur or removal  \n*   a native GPU renderer, exports about 15x faster than before on our reference laptop  \n*   a 3D camera that moves with your zooms, and five cursor themes with sculpted 3D versions  \n  \nWindows, macOS and Linux. Free and MIT, no account, no watermark. Thanks to Siddharth for starting it, and to everyone who contributes.  \n  \nWhat do you make your demos with today, and what would OpenScreen need for you to switch?",
     "kr": "Product Hunt 여러분 안녕하세요, OpenScreen의 메인테이너 Etienne입니다.  \n  \n이 프로젝트는 Screen Studio의 무료 대안을 목표로 한 Siddharth Vaddem의 사이드 프로젝트로 시작되었습니다. 그가 지난 6월 프로젝트를 아카이브한 후 그의 동의를 얻어 제가 이어받았습니다. 2.0은 이후 4개월 동안 작업한 결과물이며 지금까지 137명이 프로젝트에 기여해 주었습니다.  \n  \n새로운 기능:  \n*   로컬 MCP 서버 지원: Claude Code나 기타 에이전트가 대신 편집을 수행  \n*   클릭 기반 줌 계획: 단순 클릭당 1회가 아닌 샷 단위의 지능적 줌인  \n*   스크립트 단어 삭제 기반 컷 편집: 로컬에서 텍스트 전사 수행  \n*   녹화본 옆이나 위에 웹캠 배치: 배경 흐림 및 제거 지원  \n*   네이티브 GPU 렌더러 탑재: 레퍼런스 랩톱 기준 기존보다 약 15배 빠른 내보내기 속도  \n*   줌 이동과 연동되는 3D 카메라 및 입체 조각 스타일의 3D 커서 테마 5종  \n  \nWindows, macOS, Linux 지원. MIT 라이선스 기반의 완전 무료이며 계정 가입이나 워터마크가 없습니다. 프로젝트를 시작해 준 Siddharth와 기여해 주신 모든 분께 감사드립니다.  \n  \n현재 어떤 도구로 데모를 제작하고 계신가요? OpenScreen으로 전환하기 위해 어떤 기능이 더 필요하신가요?"

     "text": "free, MIT, no watermark on a tool this polished is rare, respect for keeping it that way through the rewrite. question on the transcript-based cutting: local transcription is never perfect, so what happens when the agent deletes a word that got misheard and the cut lands mid-sentence instead of in the pause? does it show you the edit list before committing, or is undo the main safety net there?",
     "kr": "이렇게 완성도 높은 도구가 무료, MIT 라이선스, 워터마크 없음으로 유지되는 것은 드문 일이며, 전면 재작성 과정에서도 이를 지켜낸 점에 경의를 표합니다. 스크립트 기반 컷 편집에 대해 질문이 있습니다. 로컬 텍스트 전사는 결코 완벽하지 않은데, 에이전트가 잘못 인식된 단어를 삭제하여 컷이 일시정지 구간이 아닌 문장 중간에서 잘리면 어떻게 되나요? 변경 사항을 적용하기 전에 편집 목록을 보여주나요, 아니면 실행 취소(undo)가 주된 안전장치인가요?"

     "author": "Etienne Lescot",

     "text": "@galdayan Good question. The agent cuts by word ID, not by text, so a misheard word still cuts at its own timing in the audio. For English and French the word timings come from a forced aligner, so cuts land on word boundaries; other languages use Whisper's own timings, which are looser. There's no review step yet: each edit lands as one undo step, and the cuts show on the timeline where you can drag the edges. A review-before-apply mode is something we've looked at.",

    {
     "author": "Gal Dayan",
     "is_maker": false,
     "text": "@etienne_lescot1 makes sense that undo is the safety net for now. the thing I'd flag is that it's weakest exactly where it's needed most - English and French get the forced aligner so the cuts land cleanly, but the looser Whisper timing on other languages is where a misheard word is more likely in the first place. if the review-before-apply mode ever gets built, seems like it should ship for the non-aligned languages first rather than everywhere at once.",
     "kr": "@etienne_lescot1 현재로서는 실행 취소가 안전장치라는 점이 이해가 됩니다. 제가 지적하고 싶은 점은 가장 필요한 곳에서 가장 취약하다는 점입니다. 영어와 프랑스어는 강제 정렬기가 있어 깔끔하게 잘리지만, 다른 언어의 느슨한 Whisper 타이밍이야말로 단어 오인식이 발생하기 가장 쉬운 환경이니까요. 적용 전 검토 모드가 구축된다면 모든 언어에 동시 출시하기보다 정렬기가 없는 언어들에 먼저 제공되어야 할 것 같습니다."

   "comment": "사용자의 관심 분야와 읽기 선호도에 맞춰 방대한 텍스트 콘텐츠의 핵심을 요점 위주로 압축해 주는 개인화 요약 서비스입니다."
  }
 ]
};
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
$('#summary').innerHTML='<b>오늘의 요약</b> — '+DATA.summary;
const cats=[...new Set(DATA.products.flatMap(p=>p.categories||[]))];
let state={cat:localStorage.getItem('phd_cat_'+DATA.date)||'전체',sort:localStorage.getItem('phd_sort_'+DATA.date)||'up'};
function renderToolbar(){
 const tb=$('#toolbar');tb.innerHTML='';
 cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(state.cat===c?' on':'');b.textContent=c;b.onclick=()=>{state.cat=c;localStorage.setItem('phd_cat_'+DATA.date,c);renderToolbar();renderGrid()};tb.appendChild(b)});
 const all=document.createElement('button');all.className='chip'+(state.cat==='전체'?' on':'');all.textContent='전체';all.onclick=()=>{state.cat='전체';localStorage.setItem('phd_cat_'+DATA.date,'전체');renderToolbar();renderGrid()};tb.prepend(all);
 const sp=document.createElement('div');sp.className='spacer';tb.appendChild(sp);
 const su=document.createElement('button');su.className='chip'+(state.sort==='up'?' on':'');su.textContent='업보트순';
 const sn=document.createElement('button');sn.className='chip'+(state.sort==='name'?' on':'');sn.textContent='이름순';
 su.onclick=()=>{state.sort='up';localStorage.setItem('phd_sort_'+DATA.date,'up');renderToolbar();renderGrid()};
 sn.onclick=()=>{state.sort='name';localStorage.setItem('phd_sort_'+DATA.date,'name');renderToolbar();renderGrid()};
 tb.appendChild(su);tb.appendChild(sn);
 const oa=document.createElement('button');oa.className='chip';oa.id='origall';oa.textContent='원문 모두 보기';oa.onclick=()=>{const on=!document.body.classList.contains('en-all');document.body.classList.toggle('en-all',on);document.querySelectorAll('.cmt').forEach(c=>c.classList.toggle('show-en',on));oa.textContent=on?'번역만 보기':'원문 모두 보기'};tb.appendChild(oa);
}
function priceBadge(p){return p.price_model&&p.price_model!=='확인불가'?`<span class="badge price">${p.price_model}${p.price_detail?' · '+p.price_detail:''}</span>`:`<span class="badge price">가격 확인불가</span>`}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 let ps=DATA.products.filter(p=>state.cat==='전체'||(p.categories||[]).includes(state.cat));
 ps.sort((a,b)=>state.sort==='up'?(b.upvotes-a.upvotes):a.name.localeCompare(b.name));
 ps.forEach(p=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div style="flex:1"><div class="name">${p.name}</div><div class="tag">${p.tagline_kr||''}</div></div><div class="up">▲ ${p.upvotes}</div></div>
  <div class="row">${(p.categories||[]).slice(0,3).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
  <div class="desc">${p.desc_kr||''}</div>
  <div class="foot">💬 댓글 ${p.comments?p.comments.length:0}개${p.maker?' · 메이커 '+p.maker:''}${p.website?`<a class="lnk" href="${p.website}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="lnk" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener" onclick="event.stopPropagation()">💬 PH에서 보기</a>`:''}</div>`;
  c.onclick=()=>openModal(p);g.appendChild(c);
 });
}
function openModal(p){
 const m=$('#modal');const tot=(p.comments||[]).length;
 m.innerHTML=`<button class="close" onclick="document.getElementById('mbg').classList.remove('open')">✕</button>
 <div class="m-head">${p.image?`<img src="${p.image}" onerror="this.style.visibility='hidden'">`:''}<div><h2>${p.name} <span class="up">▲ ${p.upvotes}</span></h2><div class="tag">${p.tagline_kr||''}${p.tagline_en?' — <span style="opacity:.7">'+p.tagline_en+'</span>':''}</div></div>${p.website?`<a class="visit" href="${p.website}" target="_blank" rel="nofollow noopener">🌐 웹사이트</a>`:''}${p.launch_url_used?`<a class="visit ghost" href="${p.launch_url_used}" target="_blank" rel="nofollow noopener">💬 PH에서 보기</a>`:''}</div>
 <div class="row">${(p.categories||[]).map(x=>`<span class="badge">${x}</span>`).join('')}${priceBadge(p)}</div>
 <div class="sect"><h4>제품 소개</h4><p style="font-size:14px">${p.desc_kr||''}</p>
 <p style="font-size:13px;color:var(--sub);margin-top:6px">메이커: ${p.maker||'확인 불가'} · 가격: ${p.price_model||'확인 불가'}${p.price_detail?' ('+p.price_detail+')':''}</p></div>
 ${(p.comment_summary)?`<div class="sect"><h4>댓글 흐름 한눈에</h4><p style="font-size:14px;color:var(--sub)">${p.comment_summary}</p></div>`:''}
 ${(p.warnings&&p.warnings.length)?`<div class="warn">⚠ ${p.warnings.join('<br>⚠ ')}</div>`:''}
 <div class="sect"><h4>댓글 전문 (${tot}개)</h4><div id="cmts">${(p.comments||[]).map((c,i)=>`<div class="cmt" id="c${i}"><div class="who">${c.author}${c.is_maker?'<span class="mk">메이커</span>':''}<button class="orig-btn" onclick="document.getElementById('c${i}').classList.toggle('show-en')">원문</button></div><div class="kr">${c.kr||''}</div><div class="en">${c.text||''}</div></div>`).join('')||'<p style="color:var(--sub);font-size:13px">수집된 댓글 없음</p>'}</div></div>
 ${p.launch_url_used?`<p style="font-size:11px;color:var(--sub);margin-top:10px">출처: <a href="${p.launch_url_used}" rel="nofollow">${p.launch_url_used}</a></p>`:''}`;
 $('#mbg').classList.add('open');
}
$('#mbg').addEventListener('click',e=>{if(e.target===$('#mbg'))$('#mbg').classList.remove('open')});
(function(){const n=DATA.notable||[];if(!n.length)return;const by=Object.fromEntries(DATA.products.map(p=>[p.slug||p.name,p]));const box=document.createElement('div');box.className='note';box.innerHTML='<h3>⭐ 주목할 만한 제품</h3>'+n.map(nt=>{const p=by[nt.slug]||{};return `<p style="margin-top:8px"><b style="color:var(--ink)">${p.name||nt.slug}</b> — ${nt.why}</p>`}).join('');$('#notables').appendChild(box)})();
(function(){
 const dq=DATA.disquiet;
 if(!dq||!dq.length)return;
 const sec=$('#dqsec');
 const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 const hr=document.createElement('hr');
 hr.className='dq-divider';
 sec.appendChild(hr);
 const head=document.createElement('div');
 head.className='dq-header';
 head.innerHTML=`<h2>🇰🇷 디스콰이엇 신규 프로덕트 ${dq.length}건</h2><div class="dq-sub">disquiet.io 신규 등록 · 한줄 코멘트는 AI 요약</div>`;
 sec.appendChild(head);
 const g=document.createElement('div');
 g.className='grid';
 dq.forEach(p=>{
  const c=document.createElement('div');
  c.className='card dq-card';
  const cmtHtml=p.comment?`<div class="dq-cmt">💡 ${esc(p.comment)}</div>`:'';
  c.innerHTML=`<div class="dq-head"><div class="dq-name">${esc(p.name)}</div><div class="up">▲ ${p.upvotes!=null?p.upvotes:0}</div></div>`+
   `<div class="dq-tag">${esc(p.tagline)}</div>`+
   cmtHtml+
   `<div class="dq-foot"><a class="lnk dq-lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">💬 디스콰이엇에서 보기</a></div>`;
  c.onclick=()=>{if(p.url)window.open(p.url,'_blank','noopener,noreferrer')};
  g.appendChild(c);
 });
 sec.appendChild(g);
})();
renderToolbar();renderGrid();
</script>
</body>
</html>
