<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Threads 아카이브</title>
    <style>
        :root {
            --bg-color: #0c0d0e;
            --card-bg: #18191b;
            --card-hover: #202225;
            --border-color: #2a2b2e;
            --text-color: #f3f5f7;
            --subtext-color: #9ba1a6;
            --accent-color: #0095f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 32px 16px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .page-header {
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .page-title { font-size: 24px; font-weight: 800; }
        .post-count { color: var(--subtext-color); font-size: 14px; }
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .archive-card {
            display: block;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .archive-card:hover {
            background: var(--card-hover);
            border-color: #3b3d42;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }
        .card-author {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .author-name { font-weight: 700; font-size: 15px; }
        .author-handle {
            color: var(--subtext-color);
            font-size: 13px;
            text-decoration: none;
        }
        .author-handle:hover { text-decoration: underline; }
        .card-date { color: var(--subtext-color); font-size: 12px; }
        .card-body-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card-body { margin-bottom: 14px; }
        .card-summary {
            font-size: 15px;
            color: #d8dade;
            line-height: 1.5;
        }
        .card-body-link:hover .card-summary {
            color: #ffffff;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--subtext-color);
            font-size: 13px;
        }
        .card-footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .orig-link {
            color: var(--subtext-color);
            text-decoration: none;
            font-size: 13px;
        }
        .orig-link:hover {
            color: var(--text-color);
            text-decoration: underline;
        }
        .empty-list {
            text-align: center;
            color: var(--subtext-color);
            padding: 60px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1 class="page-title">Threads 아카이브</h1>
            <span class="post-count">총 1건</span>
        </header>
        <main class="card-grid">
            
        <div class="archive-card">
            <div class="card-header">
                <div class="card-author">
                    <span class="author-name">코리안 머니 프린터</span>
                </div>
                <span class="card-date">2026-09-29 00:33</span>
            </div>
            <a href="posts/Dd1g-cvEtix.html" class="card-body-link">
                <div class="card-body">
                    <p class="card-summary">미국과 일본 창업자들은 이미 돈 버는 개꿀통을 찾았습니다.</p>
                </div>
            </a>
            <div class="card-footer">
                <div class="card-footer-left">
                    <a href="https://www.threads.net/@korean_money_printer" target="_blank" rel="noopener" class="author-handle">@korean_money_printer</a>
                    <span class="stat-item">❤️ 34</span>
                    <span class="stat-item">💬 4</span>
                </div>
                <a href="https://www.threads.net/@korean_money_printer/post/Dd1g-cvEtix" target="_blank" rel="noopener" class="orig-link">원글 ↗</a>
            </div>
        </div>
        
        </main>
    </div>
</body>
</html>
